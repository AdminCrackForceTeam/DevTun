<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ Thống Thi Trực Tuyến</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:linear-gradient(135deg,#2196f3,#00bcd4);margin:0}
.box{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
.hidden{display:none}
button{padding:10px;width:100%;margin:5px 0;background:#1e88e5;color:#fff;border:none;border-radius:6px}
input,select,textarea{width:100%;padding:8px;margin:5px 0}
.answer{padding:8px;border:1px solid #ccc;margin:5px 0;border-radius:5px;cursor:pointer}
.correct{background:#4caf50;color:white}
.wrong{background:#e53935;color:white}
.progress{height:8px;background:#ddd;border-radius:10px;margin:10px 0}
.bar{height:100%;width:0;background:#2196f3}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
</style>
</head>

<body>

<div class="box" id="home">
<h2>🎓 HỆ THỐNG THI ONLINE</h2>
<button onclick="openTeacher()">👨‍🏫 Giáo viên</button>
<button onclick="openStudent()">👨‍🎓 Học sinh</button>
<button onclick="openSupport()">🆘 Hỗ trợ</button>
</div>

<!-- LOGIN -->
<div class="box hidden" id="login">
<h3>Đăng nhập giáo viên</h3>
<input type="password" id="pass" placeholder="Mật khẩu">
<button onclick="login()">Đăng nhập</button>
<button onclick="back()">⬅ Quay lại</button>
</div>

<!-- GIÁO VIÊN -->
<div class="box hidden" id="teacher">
<h3>📘 Quản lý</h3>

<select id="subject">
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>

<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">

<select id="correct">
<option value="0">Đúng A</option>
<option value="1">Đúng B</option>
<option value="2">Đúng C</option>
<option value="3">Đúng D</option>
</select>

<button onclick="addQ()">➕ Thêm câu</button>
<button onclick="showQ()">📄 Câu hỏi</button>
<button onclick="loadScores()">📊 Bảng điểm</button>
<button onclick="loadSupport()">📨 Hỗ trợ</button>

<div id="output"></div>
<button onclick="back()">⬅ Quay lại</button>
</div>

<!-- HỌC SINH -->
<div class="box hidden" id="student">
<h3>📝 Làm bài</h3>
<input id="name" placeholder="Nhập tên">
<select id="sub">
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>
<button onclick="start()">Bắt đầu</button>

<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>
<button onclick="next()">Tiếp theo</button>
<div id="result"></div>
</div>

<!-- HỖ TRỢ -->
<div class="box hidden" id="support">
<h3>🆘 Gửi hỗ trợ</h3>
<input id="sp_name" placeholder="Tên">
<textarea id="sp_msg" placeholder="Nội dung"></textarea>
<button onclick="sendSupport()">Gửi</button>
<button onclick="back()">⬅ Quay lại</button>
</div>

<script>
const PASS="14032008";
let list=[],i=0,score=0,selected=false;

const home=document.getElementById("home");
const loginBox=document.getElementById("login");
const teacherBox=document.getElementById("teacher");
const studentBox=document.getElementById("student");
const supportBox=document.getElementById("support");

function openTeacher(){home.classList.add("hidden");loginBox.classList.remove("hidden");}
function openStudent(){home.classList.add("hidden");studentBox.classList.remove("hidden");}
function openSupport(){home.classList.add("hidden");supportBox.classList.remove("hidden");}
function back(){location.reload();}

function login(){
if(pass.value===PASS){
loginBox.classList.add("hidden");
teacherBox.classList.remove("hidden");
}else alert("Sai mật khẩu!");
}

function addQ(){
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
d.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value});
localStorage.setItem(subject.value,JSON.stringify(d));
alert("Đã thêm câu hỏi");
}

function showQ(){
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
output.innerHTML=d.map((x,i)=>`
<div>${i+1}. ${x.q}
<button onclick="delQ(${i})">❌</button></div>`).join("");
}

function delQ(i){
let d=JSON.parse(localStorage.getItem(subject.value));
d.splice(i,1);
localStorage.setItem(subject.value,JSON.stringify(d));
showQ();
}

function start(){
if(name.value=="") return alert("Nhập tên!");
list=JSON.parse(localStorage.getItem(sub.value)||"[]");
if(!list.length) return alert("Chưa có câu hỏi!");
i=0;score=0;
load();
}

function load(){
selected=false;
let q=list[i];
quiz.innerHTML=`<b>Câu ${i+1}:</b> ${q.q}`;
q.a.forEach((x,j)=>{
quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
});
bar.style.width=(i/list.length*100)+"%";
}

function choose(j,e){
if(selected) return;
selected=true;
if(j===list[i].c){e.classList.add("correct");score++}
else e.classList.add("wrong");
}

function next(){
if(!selected) return alert("Chọn đáp án!");
i++;
if(i<list.length) load();
else finish();
}

function finish(){
let data=JSON.parse(localStorage.getItem("scores")||"[]");
data.push({
name:name.value,
subject:sub.value,
score:score+"/"+list.length,
time:new Date().toLocaleString()
});
localStorage.setItem("scores",JSON.stringify(data));
result.innerHTML=`🎉 Hoàn thành<br>Điểm: ${score}/${list.length}`;
}

function loadScores(){
let s=JSON.parse(localStorage.getItem("scores")||"[]");
output.innerHTML="<table><tr><th>Tên</th><th>Môn</th><th>Điểm</th><th>Thời gian</th></tr>"
+s.map(x=>`<tr><td>${x.name}</td><td>${x.subject}</td><td>${x.score}</td><td>${x.time}</td></tr>`).join("")
+"</table>";
}

function sendSupport(){
let s=JSON.parse(localStorage.getItem("support")||"[]");
s.push({name:sp_name.value,msg:sp_msg.value,time:new Date().toLocaleString()});
localStorage.setItem("support",JSON.stringify(s));
alert("Đã gửi!");
}

function loadSupport(){
let s=JSON.parse(localStorage.getItem("support")||"[]");
output.innerHTML="<h3>Tin nhắn hỗ trợ</h3>"+s.map(x=>`
<p><b>${x.name}</b> (${x.time})<br>${x.msg}</p>`).join("");
}

document.addEventListener("visibilitychange",()=>{
if(document.hidden) alert("⚠ Không được thoát tab khi làm bài!");
});
</script>
</body>
</html>
