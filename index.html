<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ Thống Thi Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:linear-gradient(135deg,#2196f3,#00bcd4);margin:0}
.box{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
.hidden{display:none}
button{padding:10px;margin:5px 0;width:100%;background:#1976d2;color:#fff;border:none;border-radius:6px}
input,select{width:100%;padding:8px;margin:5px 0}
.answer{border:1px solid #ccc;padding:8px;margin:5px 0;border-radius:5px;cursor:pointer}
.correct{background:#4caf50;color:#fff}
.wrong{background:#f44336;color:#fff}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
.loading{text-align:center;font-size:18px}
</style>
</head>

<body>

<div class="box" id="home">
<h2>🎓 HỆ THỐNG THI ONLINE</h2>
<button onclick="openTeacher()">👨‍🏫 Giáo viên</button>
<button onclick="openStudent()">👨‍🎓 Học sinh</button>
</div>

<div class="box hidden" id="loginBox">
<h3>Đăng nhập giáo viên</h3>
<input type="password" id="pass" placeholder="Mật khẩu">
<button onclick="login()">Đăng nhập</button>
<button onclick="reload()">⬅ Quay lại</button>
</div>

<div class="box hidden" id="teacher">
<h3>👨‍🏫 Quản lý câu hỏi</h3>

<select id="subject">
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>

<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">

<select id="correct">
<option value="">-- Đáp án đúng --</option>
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>

<button onclick="addQ()">➕ Thêm câu hỏi</button>
<button onclick="showQ()">📄 Xem / Xoá câu hỏi</button>
<button onclick="showScores()">📊 Bảng điểm</button>
<button onclick="reload()">⬅ Thoát</button>

<div id="out"></div>
</div>

<div class="box hidden" id="student">
<h3>📝 Làm bài</h3>
<input id="name" placeholder="Nhập tên">
<select id="sub">
<option value="">-- Chọn môn --</option>
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>
<button onclick="start()">Bắt đầu</button>

<div id="loading" class="loading hidden">⏳ Đang tải đề...</div>
<div id="quiz"></div>
<button onclick="next()">Tiếp</button>
<div id="result"></div>
</div>

<script>
const PASS="14032008";
let list=[],i=0,score=0,selected=false;

function reload(){location.reload()}

function openTeacher(){
home.classList.add("hidden");
loginBox.classList.remove("hidden");
}

function openStudent(){
home.classList.add("hidden");
student.classList.remove("hidden");
}

function login(){
if(pass.value===PASS){
loginBox.classList.add("hidden");
teacher.classList.remove("hidden");
}else alert("Sai mật khẩu!");
}

function addQ(){
if(!q.value||!a1.value||!a2.value||!a3.value||!a4.value||correct.value==="")
return alert("Nhập đầy đủ dữ liệu!");

let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
d.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value});
localStorage.setItem(subject.value,JSON.stringify(d));
alert("Đã thêm câu hỏi!");
}

function showQ(){
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
out.innerHTML=d.map((x,i)=>`
${i+1}. ${x.q}
<button onclick="delQ(${i})">❌</button>
`).join("<br>");
}

function delQ(i){
let d=JSON.parse(localStorage.getItem(subject.value));
d.splice(i,1);
localStorage.setItem(subject.value,JSON.stringify(d));
showQ();
}

function start(){
if(!name.value||!sub.value) return alert("Nhập tên và chọn môn!");
list=JSON.parse(localStorage.getItem(sub.value)||"[]");
if(!list.length) return alert("Chưa có câu hỏi!");

loading.classList.remove("hidden");
setTimeout(()=>{
loading.classList.add("hidden");
i=0;score=0;
load();
},1200);
}

function load(){
selected=false;
let q=list[i];
quiz.innerHTML=`<b>Câu ${i+1}:</b> ${q.q}`;
q.a.forEach((x,j)=>{
quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
});
}

function choose(j,e){
if(selected) return;
selected=true;
if(j===list[i].c){e.classList.add("correct");score++}
else e.classList.add("wrong");
}

function next(){
if(!selected) return alert("Chọn đáp án!");
i++;
if(i<list.length) load();
else finish();
}

function finish(){
let arr=JSON.parse(localStorage.getItem("scores")||"[]");
arr.push({name:name.value,mon:sub.value,score:score,date:new Date().toLocaleString()});
localStorage.setItem("scores",JSON.stringify(arr));
result.innerHTML=`🎉 Hoàn thành<br>Điểm: ${score}/${list.length}`;
}

function showScores(){
let s=JSON.parse(localStorage.getItem("scores")||"[]");
out.innerHTML="<table><tr><th>Tên</th><th>Môn</th><th>Điểm</th><th>Ngày</th></tr>"+
s.map(x=>`<tr><td>${x.name}</td><td>${x.mon}</td><td>${x.score}</td><td>${x.date}</td></tr>`).join("")+
"</table>";
}
</script>
</body>
</html>
