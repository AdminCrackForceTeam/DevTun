<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra Địa Lí</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2196f3,#00bcd4);
    margin:0;
    overflow:hidden;
}
.box{
    max-width:720px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    position:relative;
    z-index:2;
}
h2{text-align:center;color:#1565c0}
.progress{
    height:8px;
    background:#ddd;
    border-radius:6px;
    overflow:hidden;
}
.bar{
    height:100%;
    width:0%;
    background:#1e88e5;
    transition:.3s;
}
.answer{
    border:1px solid #ccc;
    padding:10px;
    border-radius:6px;
    margin:8px 0;
    cursor:pointer;
}
.answer:hover{background:#e3f2fd}
.answer.active{background:#1e88e5;color:white}
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}
#result{
    text-align:center;
    font-size:18px;
    margin-top:15px;
    font-weight:bold;
}

/* Popup */
#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.popup-box{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    max-width:320px;
}
.close{
    position:absolute;
    right:20px;
    top:15px;
    font-size:22px;
    cursor:pointer;
}

/* Tuyết */
.snow{
    position:fixed;
    top:-10px;
    color:white;
    font-size:14px;
    animation: fall linear infinite;
    z-index:1;
}
@keyframes fall{
    to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<!-- Popup -->
<div id="popup">
  <div class="popup-box">
    <div class="close" onclick="startQuiz()">✖</div>
    <h3>🎉 Thi tốt nhé 12A10</h3>
    <p>Tun Chúc bạn làm bài thật tốt!</p>
    <button onclick="startQuiz()">Bắt đầu làm bài</button>
  </div>
</div>

<div class="box">
<h2>KIỂM TRA ĐỊA LÍ</h2>

<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>

<button onclick="next()">Tiếp theo</button>
<div id="result"></div>
</div>

<!-- Âm thanh -->
<audio id="ting" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="startSound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3"></audio>

<script>
function startQuiz(){
 document.getElementById("popup").style.display="none";
 document.getElementById("startSound").play();
}

/* Tuyết */
function createSnow(){
 let snow=document.createElement("div");
 snow.className="snow";
 snow.innerHTML="❄";
 snow.style.left=Math.random()*window.innerWidth+"px";
 snow.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(snow);
 setTimeout(()=>snow.remove(),8000);
}
setInterval(createSnow,200);

const questions=[

{q:"Câu 1. Vùng nào sau đây có diện tích trồng cây cà phê lớn nhất nước ta?",
a:["Trung du và miền núi phía Bắc","Đồng bằng sông Hồng","Bắc Trung Bộ","Nam Trung Bộ"],correct:3},

{q:"Câu 2. Vùng nào có diện tích trồng cây cao su lớn nhất nước ta?",
a:["Trung du và miền núi phía Bắc","Đông Nam Bộ","Bắc Trung Bộ","Đồng bằng sông Cửu Long"],correct:1},

{q:"Câu 3. Gió thổi tới nước ta vào mùa hạ chủ yếu có hướng nào?",
a:["Tây Nam","Đông Bắc","Tây Bắc","Đông Nam"],correct:0},

{q:"Câu 4. Vùng nào có số lượng đàn vịt nhiều nhất nước ta?",
a:["Bắc Trung Bộ","Nam Trung Bộ","Đồng bằng sông Hồng","Đồng bằng sông Cửu Long"],correct:3},

{q:"Câu 5. Vùng nào có số lượng trâu nhiều nhất nước ta?",
a:["Trung du và miền núi phía Bắc","Nam Trung Bộ","Đồng bằng sông Hồng","Đông Nam Bộ"],correct:0},

{q:"Câu 6. Đặc điểm đúng về đô thị hóa nước ta là?",
a:["Tốc độ đô thị hóa nhanh","Tỉ lệ dân thành thị tăng lên","Hạn chế lối sống thành thị","Không có các thành phố"],correct:1},

{q:"Câu 7. Nguyên nhân chủ yếu làm công nghiệp chế biến thực phẩm đa dạng?",
a:["Nguồn nguyên liệu tại chỗ phong phú","Nguồn lao động tay nghề cao","Cơ sở vật chất hiện đại","Nhiều thành phần kinh tế"],correct:0},

{q:"Câu 8. Cơ cấu ngành công nghiệp nước ta đang chuyển dịch theo hướng?",
a:["Chú trọng thị trường trong nước","Nâng cao trình độ công nghệ","Phát triển khai khoáng","Phát triển theo chiều rộng"],correct:1},

{q:"Câu 9. Khí hậu Nam Trung Bộ và Nam Bộ có đặc điểm gì?",
a:["Ôn hòa","Khô hạn quanh năm","Mùa mưa và mùa khô rõ rệt","Nóng ẩm quanh năm"],correct:2},

{q:"Câu 10. Mục đích chủ yếu xây dựng khu công nghiệp?",
a:["Thu hút vốn đầu tư nước ngoài","Tạo sự hợp tác ngành","Sản xuất tiêu dùng","Phân hóa lãnh thổ"],correct:0},

{q:"Câu 11. Mục đích chuyển dịch cơ cấu công nghiệp theo lãnh thổ?",
a:["Khai thác thế mạnh từng vùng","Phát triển đồng đều","Hội nhập quốc tế","Giải quyết việc làm"],correct:0},

{q:"Câu 12. Cơ cấu công nghiệp theo ngành thể hiện rõ nhất ở?",
a:["Số lượng ngành","Quan hệ giữa các ngành","Tỉ trọng các ngành","Sự phân chia ngành"],correct:2},

{q:"Câu 13. Biểu hiện suy thoái đất ở đồng bằng?",
a:["Đất đa dạng","Phù sa bồi đắp","Xói mòn mạnh","Nhiễm mặn"],correct:3},

{q:"Câu 14. Vai trò xã hội của khu công nghiệp?",
a:["Chuyển dịch cơ cấu kinh tế","Thu hút vốn đầu tư","Tăng xuất khẩu","Chuyển dịch cơ cấu lao động"],correct:3},

{q:"Câu 15. Nhận xét đúng về đô thị hóa nước ta?",
a:["Tốc độ còn chậm","Trình độ cao","Diễn ra rất nhanh","Dân thành thị chiếm cao"],correct:0},

{q:"Câu 16. Đông Nam Bộ có mức độ tập trung công nghiệp cao vì?",
a:["Giá trị sản xuất lớn","Quy mô lớn","Nhiều khu công nghiệp","Công nghệ hiện đại"],correct:2},

{q:"Câu 17. Đặc điểm địa hình Tây Bắc và Bắc Trung Bộ?",
a:["Thảo nguyên rộng","Cao nguyên xếp tầng","Đồng bằng ven biển hẹp","Đồi núi thấp"],correct:2},

{q:"Câu 18. Điểm khác nhau giữa khu công nghiệp và điểm công nghiệp?",
a:["Không có dân cư","Phân bố không đều","Vị trí thuận lợi","Không ranh giới"],correct:0},

{q:"Câu 19. Vùng có số lượng lợn nhiều nhất?",
a:["Nam Trung Bộ","Bắc Trung Bộ","Đồng bằng sông Hồng","Đông Nam Bộ"],correct:2},

{q:"Câu 20. Khu công nghệ cao có tác động chủ yếu là?",
a:["Tăng sản lượng","Đa dạng sản phẩm","Nâng cao chất lượng","Giảm phụ thuộc nguyên liệu"],correct:2},

{q:"Câu 21. Xu hướng nâng cao hiệu quả chăn nuôi?",
a:["Tăng sản phẩm không giết thịt","Phát triển dịch vụ","Đa dạng đàn vật nuôi","Ứng dụng khoa học kỹ thuật"],correct:3},

{q:"Câu 22. Gió mùa đông thổi theo hướng?",
a:["Đông Nam","Tây Bắc","Tây Nam","Đông Bắc"],correct:3},

{q:"Câu 23. Cơ cấu sản xuất công nghiệp chuyển dịch theo hướng?",
a:["Tăng công nghiệp chế biến","Giảm sản phẩm cao cấp","Tăng sản phẩm chất lượng thấp","Tăng khai thác"],correct:0},

{q:"Câu 24. Biện pháp tăng sản lượng lương thực?",
a:["Khai hoang","Thâm canh tăng vụ","Đa dạng hóa","Mô hình VAC"],correct:1},

{q:"Câu 25. Nhận xét sai về kinh tế nhà nước?",
a:["Tỉ trọng giảm","Giữ vai trò chủ đạo","Quản lí ngành then chốt","Tỉ trọng ổn định"],correct:3},

{q:"Câu 26. Vai trò khu vực đầu tư nước ngoài?",
a:["Đóng góp cao nhất","Giữ vai trò chủ đạo","Giá trị kinh tế tăng","Tỉ trọng ổn định"],correct:2},

{q:"Câu 27. Đặc điểm ngành dầu khí?",
a:["Thu hút nhiều vốn đầu tư","Đáp ứng đủ nhu cầu","Kĩ thuật lạc hậu","Tập trung miền Bắc"],correct:0},

{q:"Câu 28. Biểu hiện suy giảm tài nguyên sinh vật?",
a:["Chất lượng rừng giảm","Xuất hiện loài mới","Phân bố rộng","Tăng rừng trồng"],correct:0},

{q:"Câu 29. Vùng nuôi trồng thủy sản lớn nhất?",
a:["Đồng bằng sông Hồng","Đông Nam Bộ","Bắc Trung Bộ","Đồng bằng sông Cửu Long"],correct:3},

{q:"Câu 30. Nhân tố ảnh hưởng lớn nhất đến khu công nghiệp?",
a:["Nguồn lao động","Cách mạng công nghiệp","Thị trường","Cơ sở vật chất"],correct:1},
];

let i=0,score=0,selected=-1;

function load(){
 let q=questions[i];
 let html=`<b>${q.q}</b>`;
 q.a.forEach((x,j)=>{
   html+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
 });
 document.getElementById("quiz").innerHTML=html;
 document.getElementById("bar").style.width=(i/questions.length*100)+"%";
}

function choose(j,el){
 selected=j;
 document.querySelectorAll(".answer").forEach(e=>e.classList.remove("active"));
 el.classList.add("active");
}

function next(){
 if(selected==-1){alert("Vui lòng chọn đáp án!");return;}
 if(selected===questions[i].correct){
   document.getElementById("ting").play();
   score++;
 }
 i++; selected=-1;
 if(i<questions.length) load();
 else{
   document.getElementById("quiz").innerHTML="";
   document.getElementById("result").innerHTML=`🎉 Hoàn thành bài thi<br>Điểm: <b>${score}/30</b>`;
 }
}
load();
</script>
</body>
</html>
