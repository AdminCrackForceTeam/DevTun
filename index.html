<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ Thống Thi Online Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Roboto',sans-serif;
  margin:0;
  overflow-x:hidden;
  position:relative;
  transition:background 0.3s,color 0.3s;
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  color:#000;
}

/* Dark Mode */
body.dark{background:linear-gradient(135deg,#1e1e2f,#2e2e3e);color:#fff;}
body.dark .box{background:#2e2e3e;color:#fff;}
body.dark .card{background:linear-gradient(135deg,#4b6584,#1e3799);}
body.dark .progress-container{background:#555;}
body.dark .progress-bar{background:#00b894;}

/* Common */
.box{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  position:relative;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  transition:all 0.3s;
}
.hidden{display:none;}
button{
  padding:12px;
  margin:5px 0;
  width:100%;
  background:linear-gradient(135deg,#6a11cb,#2575fc);
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:500;
  font-size:16px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  transition:all 0.3s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}
.answer{
  border:1px solid #ccc;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.3s;
  background:#f1f1f1;
}
.answer:hover{background:#d0e6ff;}
.correct{
  background:#4caf50;
  color:#fff;
  animation:blink 0.5s ease 0s 3;
}
.wrong{
  background:#f44336;
  color:#fff;
  animation:shake 0.5s;
}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:14px;}
.loading{text-align:center;font-size:18px;}
.close-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:#f44336;
  width:35px;
  height:35px;
  color:#fff;
  border:none;
  border-radius:50%;
  font-weight:bold;
  cursor:pointer;
  z-index:10;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition:all 0.3s;
}
.close-btn:hover{transform:scale(1.2);box-shadow:0 8px 25px rgba(0,0,0,0.5);}

/* Animations */
@keyframes blink{0%{opacity:1}50%{opacity:0.2}100%{opacity:1}}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}100%{transform:translateX(0)}}

/* Progress Bar */
.progress-container{width:100%;background:#ddd;border-radius:5px;margin:10px 0;}
.progress-bar{width:0%;height:12px;background:#4caf50;border-radius:5px;transition: width 0.3s;}

/* Snow */
.snowflake{position:fixed;top:-10px;color:#fff;font-size:1em;z-index:9999;user-select:none;pointer-events:none;animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(110vh)}}

/* Menu Cards */
.menu-cards{display:flex;justify-content:center;gap:30px;margin-top:30px;flex-wrap:wrap;}
.card{
  width:180px;
  height:180px;
  background:linear-gradient(135deg,#42a5f5,#1e88e5);
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-weight:bold;
  font-size:20px;
  cursor:pointer;
  transition:all 0.3s;
}
.card:hover{transform:scale(1.05);box-shadow:0 12px 25px rgba(0,0,0,0.5);}
.icon{font-size:50px;margin-bottom:10px;}
.text{font-size:22px;}

/* Dark Mode Toggle */
#darkToggle{
  position:fixed;
  top:10px;
  left:10px;
  padding:12px;
  background:#ffa502;
  border:none;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  font-weight:500;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition:0.3s;
}
#darkToggle:hover{background:#e67e22;transform:scale(1.05);}
</style>
</head>
<body>

<!-- Dark Mode Toggle -->
<button id="darkToggle">🌙 Dark Mode</button>

<!-- Audio -->
<audio id="soundCorrect" src="https://freesound.org/data/previews/341/341695_3248244-lq.mp3"></audio>
<audio id="soundWrong" src="https://freesound.org/data/previews/276/276020_5121236-lq.mp3"></audio>

<!-- Menu Home -->
<div class="box" id="home">
<h2>🎓 HỆ THỐNG THI ONLINE PRO</h2>
<div class="menu-cards">
  <div class="card" onclick="openTeacher()"><div class="icon">👨‍🏫</div><div class="text">Giáo viên</div></div>
  <div class="card" onclick="openStudent()"><div class="icon">👨‍🎓</div><div class="text">Học sinh</div></div>
</div>
</div>

<!-- Login -->
<div class="box hidden" id="loginBox">
<button class="close-btn" onclick="reload()">✖</button>
<h3>Đăng nhập giáo viên</h3>
<input type="password" id="pass" placeholder="Mật khẩu">
<button onclick="login()">Đăng nhập</button>
<button onclick="reload()">⬅ Quay lại</button>
</div>

<!-- Teacher -->
<div class="box hidden" id="teacher">
<button class="close-btn" onclick="reload()">✖</button>
<h3>👨‍🏫 Quản lý</h3>
<select id="subject">
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>
<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">
<select id="correct">
<option value="">-- Đáp án đúng --</option>
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>
<button onclick="addQ()">➕ Thêm câu hỏi</button>
<button onclick="showQ()">📄 Xem / Xoá câu hỏi</button>
<button onclick="showScores()">📊 Xem điểm</button>
<button onclick="viewStudentMode()">👁 Xem như Học sinh</button>
<button onclick="clearScores()">🗑 Xoá dữ liệu học sinh</button>
<button onclick="reload()">⬅ Thoát</button>
<div id="out"></div>
</div>

<!-- Student -->
<div class="box hidden" id="student">
<button class="close-btn" onclick="reload()">✖</button>
<h3>📝 Làm bài</h3>
<input id="nameInput" placeholder="Nhập tên học sinh">
<select id="sub">
<option value="">-- Chọn môn --</option>
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>
<button onclick="start()">Bắt đầu</button>
<div id="loading" class="loading hidden">⏳ Đang tải đề...</div>
<div id="quiz"></div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div style="display:flex;justify-content:space-between">
<button onclick="prev()">⬅ Quay lại</button>
<button onclick="next()">Tiếp ➡</button>
</div>
<div id="result"></div>
</div>

<script>
// ===== Variables =====
const PASS="14032008";
let list=[],i=0,score=0,selected=false;
const home=document.getElementById("home");
const loginBox=document.getElementById("loginBox");
const teacher=document.getElementById("teacher");
const student=document.getElementById("student");
const out=document.getElementById("out");
const quiz=document.getElementById("quiz");
const loading=document.getElementById("loading");
const result=document.getElementById("result");
const nameInput=document.getElementById("nameInput");
const sub=document.getElementById("sub");
const pass=document.getElementById("pass");
const subject=document.getElementById("subject");
const q=document.getElementById("q");
const a1=document.getElementById("a1");
const a2=document.getElementById("a2");
const a3=document.getElementById("a3");
const a4=document.getElementById("a4");
const correct=document.getElementById("correct");
const progressBar=document.getElementById("progressBar");
const soundCorrect=document.getElementById("soundCorrect");
const soundWrong=document.getElementById("soundWrong");
const darkToggle=document.getElementById("darkToggle");

// ===== Snow =====
function createSnow(){
    for(let j=0;j<50;j++){
        let snow=document.createElement("div");
        snow.className="snowflake";
        snow.style.left=Math.random()*100+"%";
        snow.style.fontSize=(Math.random()*15+10)+"px";
        snow.style.animationDuration=(Math.random()*5+5)+"s";
        snow.style.opacity=Math.random();
        snow.innerHTML="❄";
        document.body.appendChild(snow);
    }
}
createSnow();

// ===== Dark Mode =====
darkToggle.addEventListener('click',()=>{document.body.classList.toggle('dark');});

// ===== Functions =====
function reload(){location.reload();}
function openTeacher(){home.classList.add("hidden");loginBox.classList.remove("hidden");}
function openStudent(){home.classList.add("hidden");student.classList.remove("hidden");}
function login(){if(pass.value===PASS){loginBox.classList.add("hidden");teacher.classList.remove("hidden");}else alert("Sai mật khẩu!");}
function addQ(){if(!q.value||!a1.value||!a2.value||!a3.value||!a4.value||correct.value==="") return alert("Nhập đầy đủ!"); let d=JSON.parse(localStorage.getItem(subject.value)||"[]"); d.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value}); localStorage.setItem(subject.value,JSON.stringify(d)); alert("Đã lưu câu hỏi!");}
function showQ(){let d=JSON.parse(localStorage.getItem(subject.value)||"[]"); out.innerHTML=d.map((x,i)=>`${i+1}. ${x.q} <button onclick="delQ(${i})">❌</button>`).join("<br>");}
function delQ(i){let d=JSON.parse(localStorage.getItem(subject.value)); d.splice(i,1); localStorage.setItem(subject.value,JSON.stringify(d)); showQ();}
function start(){let name=nameInput.value.trim();let mon=sub.value;if(name==""||mon==""){alert("Vui lòng nhập tên và chọn môn!"); return;}list=JSON.parse(localStorage.getItem(mon)||"[]");if(list.length==0){alert("Môn này chưa có câu hỏi!"); return;}loading.classList.remove("hidden"); setTimeout(()=>{loading.classList.add("hidden"); i=0; score=0; load(); updateProgress();},1200);}
function load(){selected=false; let qObj=list[i]; quiz.innerHTML=`<b>Câu ${i+1}/${list.length}:</b> ${qObj.q}`; qObj.a.forEach((x,j)=>{quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;}); updateProgress();}
function choose(j,e){if(selected) return; selected=true; if(j===list[i].c){e.classList.add("correct"); soundCorrect.play(); score++;}else{e.classList.add("wrong"); soundWrong.play(); alert("⚠ Đáp án sai!");}}
function next(){if(!selected) return alert("Chọn đáp án!"); i++; if(i<list.length) load(); else finish();}
function prev(){if(i>0){i--; load();}else alert("Bạn đang ở câu đầu tiên!");}
function finish(){let arr=JSON.parse(localStorage.getItem("scores")||"[]"); arr.push({name:nameInput.value.trim(),mon:sub.value,score:score,date:new Date().toLocaleString()}); localStorage.setItem("scores",JSON.stringify(arr)); result.innerHTML=`🎉 Hoàn thành<br>Điểm: ${score}/${list.length}`; showConfetti();}
function showScores(){let s=JSON.parse(localStorage.getItem("scores")||"[]"); out.innerHTML="<table><tr><th>Tên</th><th>Môn</th><th>Điểm</th><th>Ngày</th></tr>"+s.map(x=>`<tr><td>${x.name}</td><td>${x.mon}</td><td>${x.score}</td><td>${x.date}</td></tr>`).join("")+"</table>";}
function clearScores(){if(confirm("Xoá toàn bộ dữ liệu học sinh?")){localStorage.removeItem("scores"); alert("Đã xoá dữ liệu!"); out.innerHTML="";}}
function viewStudentMode(){teacher.classList.add("hidden");student.classList.remove("hidden");}
function updateProgress(){ let percent=((i)/list.length)*100; progressBar.style.width=percent+"%";}
function showConfetti(){for(let i=0;i<100;i++){let conf=document.createElement("div");conf.style.position="fixed";conf.style.width="10px";conf.style.height="10px";conf.style.background=["#ff4757","#1e90ff","#2ed573","#ffa502"][Math.floor(Math.random()*4)];conf.style.top="0px";conf.style.left=Math.random()*window.innerWidth+"px";conf.style.zIndex=9999;conf.style.opacity=Math.random();conf.style.borderRadius="50%";document.body.appendChild(conf);let fall=setInterval(()=>{let top=parseFloat(conf.style.top); conf.style.top=(top+5)+"px"; if(top>window.innerHeight){conf.remove(); clearInterval(fall);}},30);}}
</script>
</body>
</html>
