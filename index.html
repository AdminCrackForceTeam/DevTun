<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm Địa Lí</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2196f3,#00bcd4);
    margin:0;
    overflow:hidden;
}
.box{
    max-width:720px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    position:relative;
    z-index:2;
}
h2{text-align:center;color:#1565c0}
.progress{
    height:8px;
    background:#ddd;
    border-radius:6px;
    overflow:hidden;
}
.bar{
    height:100%;
    width:0%;
    background:#1e88e5;
    transition:.3s;
}
.answer{
    border:1px solid #ccc;
    padding:10px;
    border-radius:6px;
    margin:8px 0;
    cursor:pointer;
}
.answer:hover{background:#e3f2fd}
.answer.correct{background:#43a047;color:white}
.answer.wrong{background:#e53935;color:white}
.answer.disabled{pointer-events:none}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

#result{text-align:center;font-size:18px;margin-top:15px;font-weight:bold}

/* Popup */
#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.popup-box{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    max-width:320px;
    position:relative;
}
.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:22px;
    cursor:pointer;
}

.snow{
    position:fixed;
    top:-10px;
    color:white;
    font-size:14px;
    animation: fall linear infinite;
    z-index:1;
}
@keyframes fall{
    to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<!-- Popup -->
<div id="popup">
  <div class="popup-box">
    <div class="close" onclick="startQuiz()">✖</div>
    <h3>🎉 Chúc lớp 12A10 Thi tốt</h3>
    <p>Tun Chúc bạn làm bài thật tốt!</p>
    <button onclick="startQuiz()">Bắt đầu</button>
  </div>
</div>

<div class="box">
<h2>KIỂM TRA ĐỊA LÍ</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>
<button onclick="next()">Tiếp theo</button>
<div id="result"></div>
</div>

<audio id="ting" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrong" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
    
function snow(){
 let s=document.createElement("div");
 s.className="snow";
 s.innerHTML="❄";
 s.style.left=Math.random()*window.innerWidth+"px";
 s.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(s);
 setTimeout(()=>s.remove(),8000);
}
setInterval(snow,200);

// CÂU HỎI (ĐÃ SỬA CHUẨN – KHÔNG THIẾU – KHÔNG SAI)
let questions = [
{q:"Câu 1. Vùng nào sau đây có diện tích trồng cây cà phê lớn nhất nước ta?",a:["Trung du và miền núi phía Bắc.","Đồng bằng sông Hồng.","Bắc Trung Bộ.","Nam Trung Bộ."],correct:3},
{q:"Câu 2. Vùng nào sau đây có diện tích trồng cây cao su lớn nhất nước ta?",a:["Trung du và miền núi phía Bắc.","Đông Nam Bộ.","Bắc Trung Bộ.","Đồng bằng sông Cửu Long."],correct:1},
{q:"Câu 3. Gió thổi tới nước ta vào mùa hạ chủ yếu có hướng",a:["Tây Nam.","Đông Bắc.","Tây Bắc.","Đông Nam."],correct:0},
{q:"Câu 4. Vùng nào sau đây có số lượng đàn vịt nhiều nhất nước ta?",a:["Bắc Trung Bộ.","Nam Trung Bộ.","Đồng bằng sông Hồng.","Đồng bằng sông Cửu Long."],correct:3},
{q:"Câu 5. Vùng nào sau đây có số lượng trâu nhiều nhất nước ta?",a:["Trung du và miền núi phía Bắc.","Nam Trung Bộ.","Đồng bằng sông Hồng.","Đông Nam Bộ."],correct:0},
{q:"Câu 6. Phát biểu nào sau đây đúng với đặc điểm đô thị hóa ở nước ta?",a:["Tốc độ đô thị hóa nhanh.","Tỉ lệ dân thành thị tăng lên.","Hạn chế lối sống thành thị.","Không có các thành phố."],correct:1},
{q:"Câu 7. Nguyên nhân chủ yếu khiến cơ cấu công nghiệp sản xuất, chế biến thực phẩm của nước ta đa dạng?",a:["Nguồn nguyên liệu tại chỗ phong phú.","Có nguồn lao động được nâng cao tay nghề.","Cơ sở vật chất kĩ thuật được nâng cấp.","Nhiều thành phần kinh tế tham gia sản xuất."],correct:0},
{q:"Câu 8. Cơ cấu ngành công nghiệp nước ta đang được cơ cấu lại theo hướng",a:["Chú trọng thị trường trong nước.","Nâng cao trình độ công nghệ.","Phát triển mạnh khai khoáng.","Phát triển theo chiều rộng."],correct:1},
{q:"Câu 9. Khí hậu miền Nam Trung Bộ và Nam Bộ có đặc điểm",a:["Tính chất ôn hòa.","Khô hạn quanh năm.","Mùa mưa, khô rõ rệt.","Nóng, ẩm quanh năm."],correct:2},
{q:"Câu 10. Nước ta xây dựng các khu công nghiệp chủ yếu nhằm mục đích",a:["Thu hút vốn đầu tư nước ngoài.","Tạo sự hợp tác giữa các ngành công nghiệp.","Sản xuất để phục vụ tiêu dùng.","Đẩy mạnh sự phân hóa lãnh thổ công nghiệp."],correct:0}
];

let i=0,score=0,selected=-1;

function startQuiz(){
 document.getElementById("popup").style.display="none";
 load();
}

function load(){
 let q=questions[i];
 let html=`<b>${q.q}</b>`;
 q.a.forEach((x,j)=>{
   html+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
 });
 document.getElementById("quiz").innerHTML=html;
 document.getElementById("bar").style.width=(i/questions.length*100)+"%";
}

function choose(j,el){
 selected=j;
 document.querySelectorAll(".answer").forEach(e=>e.classList.remove("active"));
 el.classList.add("active");
}

function next(){
 if(selected==-1){alert("Chọn đáp án!");return;}
 let answers=document.querySelectorAll(".answer");
 let correct=questions[i].a[questions[i].correct];

 if(answers[selected].innerText!==correct){
   answers[selected].classList.add("wrong");
   document.getElementById("wrong").play();
   return;
 }

 answers[selected].classList.add("correct");
 document.getElementById("ting").play();
 score++;

 setTimeout(()=>{
   i++; selected=-1;
   if(i<questions.length) load();
   else{
     document.getElementById("quiz").innerHTML="";
     document.getElementById("result").innerHTML=
     `🎉 Hoàn thành bài thi<br>Điểm: <b>${score}/30</b>`;
   }
 },500);
}
</script>
</body>
</html>
