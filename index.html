<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>FF-ish Lite — Web FPS</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#071027;color:#e6eef8;font-family:Inter,Segoe UI,Roboto,system-ui,-apple-system}
  #ui{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px;pointer-events:none;z-index:75}
  .left, .right {display:flex;gap:8px;align-items:center;pointer-events:auto}
  #hud{background:rgba(3,6,12,0.55);padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);font-size:14px}
  #centerMsg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:70;pointer-events:none}
  .centerBox{background:rgba(4,6,12,0.85);padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);text-align:center;pointer-events:auto;color:#e6eef8}
  button{background:#0b1220;border:1px solid rgba(255,255,255,0.04);color:inherit;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}
  #overlayMobile{position:fixed;right:12px;bottom:12px;display:none;z-index:80}
  .bigBtn{width:84px;height:84px;border-radius:48px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:18px}
  #touchAim{position:fixed;left:12px;bottom:12px;width:140px;height:140px;border-radius:12px;background:rgba(255,255,255,0.02);display:none;z-index:80}
  #fpsCanvas{display:block;width:100vw;height:100vh}
  @media (max-width:900px){
    #overlayMobile{display:block}
    #touchAim{display:block}
    .centerBox{width:90%;max-width:420px}
  }
  /* simple crosshair */
  .crosshair {position:fixed;left:50%;top:50%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;pointer-events:none;z-index:60}
  .crosshair:before, .crosshair:after {content:'';position:absolute;background:rgba(255,255,255,0.9);border-radius:2px}
  .crosshair:before {left:9px;top:0;width:2px;height:20px}
  .crosshair:after {top:9px;left:0;height:2px;width:20px}
</style>
</head>
<body>
  <canvas id="fpsCanvas"></canvas>

  <div id="ui">
    <div class="left">
      <div id="hud">HP: <span id="hp">100</span> &nbsp;|&nbsp; Score: <span id="score">0</span> &nbsp;|&nbsp; Level: <span id="level">1</span></div>
    </div>
    <div class="right">
      <div id="highBox" style="background:rgba(255,255,255,0.03);padding:8px;border-radius:8px">High: <strong id="highscore">0</strong></div>
      <div style="width:8px"></div>
      <button id="btnStart">Bắt đầu</button>
    </div>
  </div>

  <div class="crosshair"></div>

  <div id="overlayMobile">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <div class="bigBtn" id="btnFire">BẮN</div>
    </div>
  </div>

  <div id="touchAim"></div>

  <div id="centerMsg">
    <div class="centerBox" id="centerBox">
      <h2 id="title">FF-ish Lite</h2>
      <p style="color:#9fb0c8">Phiên bản web 3D FPS nhẹ — xoay ngang (landscape) để chơi tốt nhất. Có âm thanh súng & hiệu ứng.</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
        <button id="btnStart2">Bắt đầu</button>
        <button id="btnHow">Hướng dẫn</button>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.154.0/examples/js/controls/PointerLockControls.js"></script>

<script>
/*
  FF-ish Lite
  - three.js based lightweight FPS
  - WebAudio-generated sounds (no external files)
*/
(() => {
  // --- Basic scene setup ---
  const canvas = document.getElementById('fpsCanvas');
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.shadowMap.enabled = true;
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b1730, 0.0025);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
  camera.position.set(0,1.6,0);

  const controls = new THREE.PointerLockControls(camera, canvas);

  // lighting
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(100,150,50);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024,1024);
  scene.add(dir);
  const amb = new THREE.AmbientLight(0xffffff, 0.25);
  scene.add(amb);

  // ground
  const groundMat = new THREE.MeshStandardMaterial({color:0x1b3b2f, roughness:1, metalness:0});
  const groundGeo = new THREE.PlaneGeometry(4000,4000);
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // simple environment objects (boxes / crates) for cover
  const crates = new THREE.Group();
  const boxGeo = new THREE.BoxGeometry(6,6,6);
  const boxMat = new THREE.MeshStandardMaterial({color:0x6b4b3a});
  for(let i=0;i<75;i++){
    const m = new THREE.Mesh(boxGeo, boxMat);
    m.position.set((Math.random()-0.5)*800,3,(Math.random()-0.5)*800);
    m.rotation.y = Math.random()*Math.PI*2;
    m.castShadow = true;
    m.receiveShadow = true;
    crates.add(m);
  }
  scene.add(crates);

  // simple sky (large sphere)
  const skyGeo = new THREE.SphereGeometry(1200, 16, 16);
  const skyMat = new THREE.MeshBasicMaterial({color:0x07203b, side: THREE.BackSide});
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // player state
  const player = {vel: new THREE.Vector3(), speed: 8.0, hp: 100, score:0, level:1, position: new THREE.Vector3()};
  document.getElementById('hp').textContent = player.hp;
  document.getElementById('score').textContent = player.score;

  // enemies
  const enemies = [];

  // bullet tracer objects (visual)
  const tracers = [];

  // clock
  const clock = new THREE.Clock();

  // resizing
  function resize(){
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  // movement controls (WASD + touch joystick simplified)
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' '){ e.preventDefault(); tryShoot(); }
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // touch controls: touch aim area + fire button
  const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 900;
  if (isMobile) {
    document.getElementById('overlayMobile').style.display = 'block';
    document.getElementById('touchAim').style.display = 'block';
  }

  // pointer lock start
  const centerMsg = document.getElementById('centerMsg');
  const btnStart = document.getElementById('btnStart');
  const btnStart2 = document.getElementById('btnStart2');
  function startGame(){
    // request pointer lock for desktop
    if (!isMobile) {
      controls.lock();
    }
    centerMsg.style.display = 'none';
    lastShot = 0;
    spawnTimer = 0;
    player.hp = 100; player.score = 0; player.level = 1;
    document.getElementById('hp').textContent = player.hp;
    document.getElementById('score').textContent = player.score;
    document.getElementById('level').textContent = player.level;
    // place player at center
    controls.getObject().position.set(0,1.6,0);
    camera.position.set(0,1.6,0);
    animate();
  }
  btnStart.addEventListener('click', startGame);
  btnStart2.addEventListener('click', startGame);

  // show how
  document.getElementById('btnHow').addEventListener('click', () => {
    alert('WASD hoặc chạm joystick để di chuyển, chuột để nhìn, click/space để bắn. Trên mobile dùng nút BẮN. Xoay ngang màn hình để chơi tốt hơn.');
  });

  // --- WebAudio: generate gunshot / hit / explosion sounds dynamically ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playGunshot(){
    const now = audioCtx.currentTime;
    // short noise burst + pitch sweep
    const bufferSize = audioCtx.sampleRate * 0.12;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      const n = (Math.random()*2-1) * Math.exp(-i/bufferSize*6);
      data[i] = n * (Math.random()*0.6 + 0.4);
    }
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const gain = audioCtx.createGain(); gain.gain.value = 0.6;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 800;
    src.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
    src.start(now);
    // short transient click
    const osc = audioCtx.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(800, now);
    const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.12, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(g2); g2.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.09);
  }

  function playHit(){
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(220, now);
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.18);
  }

  function playExplosion(){
    const now = audioCtx.currentTime;
    // long noise
    const bufSize = audioCtx.sampleRate * 0.6;
    const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const d = buffer.getChannelData(0);
    for(let i=0;i<bufSize;i++){
      d[i] = (Math.random()*2-1) * Math.exp(-i/bufSize*1.5);
    }
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const g = audioCtx.createGain(); g.gain.value = 0.9;
    const lf = audioCtx.createBiquadFilter(); lf.type='lowpass'; lf.frequency.value = 1000;
    src.connect(lf); lf.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }

  // --- Shooting / Raycasting ---
  const raycaster = new THREE.Raycaster();
  let lastShot = 0;
  const fireRate = 160; // ms between shots

  function tryShoot(){
    const now = performance.now();
    if (now - lastShot < fireRate) return;
    lastShot = now;
    // audio
    try{ audioCtx.resume().then(()=>playGunshot()); }catch(e){}
    // muzzle flash small camera kick
    recoil = Math.min(1.2, recoil + 0.6);

    // ray from camera center
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    const hits = raycaster.intersectObjects(enemies.map(e=>e.mesh), false);
    // visual tracer
    const origin = camera.position.clone();
    const dir = new THREE.Vector3(); raycaster.ray.direction.clone(dir);
    const tracerEnd = origin.clone().add(dir.clone().multiplyScalar(1200));
    addTracer(origin, tracerEnd);

    if (hits.length > 0){
      const hit = hits[0];
      // find enemy object
      const em = enemies.find(en => en.mesh === hit.object);
      if (em){
        em.hp -= 35; // damage
        playHit();
        spawnHitParticle(hit.point);
        if (em.hp <= 0){
          killEnemy(em);
        }
      }
    }
  }

  // bind mouse click / touch fire
  window.addEventListener('mousedown', (e) => { tryShoot(); });
  document.getElementById('btnFire').addEventListener('touchstart', (e) => { e.preventDefault(); tryShoot(); }, {passive:false});
  document.getElementById('btnFire').addEventListener('mousedown', (e) => { tryShoot(); });

  // touch aim: move camera orientation by touch dragging on left area
  let touching = false, lastTouch = null;
  const touchAim = document.getElementById('touchAim');
  touchAim.addEventListener('touchstart', (e) => { touching = true; lastTouch = e.touches[0]; }, {passive:false});
  touchAim.addEventListener('touchmove', (e) => {
    if (!touching) return;
    const t = e.touches[0];
    const dx = (t.clientX - lastTouch.clientX) * 0.0025;
    const dy = (t.clientY - lastTouch.clientY) * 0.0025;
    controls.getObject().rotation.y -= dx;
    camera.rotation.x = clamp(camera.rotation.x - dy, -Math.PI/2 + 0.1, Math.PI/2 - 0.1);
    lastTouch = t;
  }, {passive:false});
  touchAim.addEventListener('touchend', (e) => { touching = false; lastTouch = null; }, {passive:false});

  // helper clamp
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // tracer visual
  function addTracer(start, end){
    const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
    const mat = new THREE.LineBasicMaterial({color:0xffe59e, transparent:true, opacity:0.95});
    const line = new THREE.Line(geo, mat);
    line.frustumCulled = false;
    scene.add(line);
    tracers.push({line, life:0.08});
  }

  // hit particles
  const particles = [];
  function spawnHitParticle(pos){
    playHit();
    for (let i=0;i<12;i++){
      const v = new THREE.Vector3((Math.random()-0.5)*7, (Math.random()-0.2)*6, (Math.random()-0.5)*7);
      particles.push({pos: pos.clone(), vel: v, life: 0.6});
    }
  }

  // kill enemy
  function killEnemy(em){
    player.score += 10 + Math.floor(Math.random()*6) + player.level*2;
    // explosion audio + effect
    playExplosion();
    spawnHitParticle(em.mesh.position);
    scene.remove(em.mesh);
    const idx = enemies.indexOf(em); if (idx>=0) enemies.splice(idx,1);
    updateHUD();
  }

  // --- Enemy spawn & behavior ---
  let spawnTimer = 0;
  let spawnInterval = 2000; // ms
  function spawnEnemy(){
    const radius = 250 + Math.random()*250;
    const ang = Math.random()*Math.PI*2;
    const x = Math.cos(ang)*radius;
    const z = Math.sin(ang)*radius;
    const geo = new THREE.SphereGeometry(2.2 + Math.random()*2.8, 8, 8);
    const mat = new THREE.MeshStandardMaterial({color:0xff6b6b});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x,1.4,z);
    mesh.castShadow = true;
    scene.add(mesh);
    enemies.push({mesh, hp: 80 + Math.floor(Math.random()*60), speed: (1.0 + Math.random()*0.6) + player.level*0.12});
  }

  // enemy AI move toward player
  function updateEnemies(dt){
    for (const e of enemies){
      const pos = e.mesh.position;
      const dir = new THREE.Vector3().subVectors(controls.getObject().position, pos);
      const dist = dir.length();
      dir.normalize();
      // move closer
      if (dist > 3.2){
        pos.add(dir.multiplyScalar(e.speed * dt));
      } else {
        // melee hit
        if (!e.lastHit || performance.now() - e.lastHit > 800){
          e.lastHit = performance.now();
          player.hp -= 8;
          flash = 0.16;
          document.getElementById('hp').textContent = player.hp;
          if (player.hp <= 0) gameOver();
        }
      }
      // face player
      e.mesh.lookAt(controls.getObject().position.x, e.mesh.position.y, controls.getObject().position.z);
    }
  }

  // HUD update
  function updateHUD(){
    document.getElementById('score').textContent = player.score;
    document.getElementById('level').textContent = player.level;
    const hs = Number(localStorage.getItem('ffish_hs') || 0);
    document.getElementById('highscore').textContent = hs;
  }

  // particles render
  function updateParticles(dt){
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      p.vel.y -= 9.8 * dt * 0.9;
      p.pos.add(p.vel.clone().multiplyScalar(dt));
      if (p.life <= 0) particles.splice(i,1);
    }
  }

  // simple particle renderer using small planes
  const particleGroup = new THREE.Group(); scene.add(particleGroup);
  function renderParticles(){
    // clear group
    while(particleGroup.children.length) particleGroup.remove(particleGroup.children[0]);
    for (const p of particles){
      const m = new THREE.Mesh(new THREE.PlaneGeometry(0.35,0.35), new THREE.MeshBasicMaterial({color:0xffc9a3,transparent:true,opacity: Math.max(0, p.life/0.6)}));
      m.position.copy(p.pos);
      m.lookAt(camera.position);
      particleGroup.add(m);
    }
  }

  // tracers update
  function updateTracers(dt){
    for (let i=tracers.length-1;i>=0;i--){
      tracers[i].life -= dt;
      tracers[i].line.material.opacity = tracers[i].life / 0.08;
      if (tracers[i].life <= 0){
        scene.remove(tracers[i].line);
        tracers.splice(i,1);
      }
    }
  }

  // recoil effect (simple camera pitch offset)
  let recoil = 0;
  let flash = 0;

  // animate loop
  let running = false;
  function animate(){
    if (running) return; running = true;
    let last = performance.now();
    function frame(){
      const now = performance.now();
      const dt = Math.min(50, now - last) / 1000;
      last = now;

      // movement - WASD
      const forward = (keys['w'] || keys['arrowup']) ? 1 : (keys['s'] || keys['arrowdown']) ? -1 : 0;
      const right = (keys['d'] || keys['arrowright']) ? 1 : (keys['a'] || keys['arrowleft']) ? -1 : 0;
      // compute move vector in camera space
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0; camDir.normalize();
      const camRight = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), camDir).normalize();
      const move = new THREE.Vector3();
      move.add(camDir.multiplyScalar(forward));
      move.add(camRight.multiplyScalar(right));
      if (move.lengthSq() > 0) move.normalize().multiplyScalar(player.speed * dt);
      controls.getObject().position.add(move);

      // gravity / floor clamp
      if (controls.getObject().position.y < 1.6) controls.getObject().position.y = 1.6;

      // spawn enemies over time
      spawnTimer += dt * 1000;
      if (spawnTimer >= spawnInterval){
        spawnTimer = 0;
        const count = 1 + Math.floor(player.level / 2);
        for (let i=0;i<count;i++) spawnEnemy();
        spawnInterval = Math.max(650, spawnInterval - 20);
      }

      // update enemies
      updateEnemies(dt);

      // update tracers & particles
      updateTracers(dt);
      updateParticles(dt);
      renderParticles();

      // update bullets visuals (none else)

      // update recoil camera
      if (recoil > 0){
        camera.rotation.x = clamp(camera.rotation.x - recoil * 0.25, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
        recoil = Math.max(0, recoil - dt * 2.8);
      }

      // render
      renderer.render(scene, camera);

      // overlay flash when hit
      if (flash > 0){
        flash = Math.max(0, flash - dt * 1.5);
        // draw a transient overlay div or use CSS - we use body background tint
        document.body.style.background = `rgba(255,60,60,${flash*0.08})`;
      } else {
        document.body.style.background = '';
      }

      // level progression
      const newLvl = Math.floor(player.score / 80) + 1;
      if (newLvl !== player.level){
        player.level = newLvl;
        player.speed += 0.6;
        document.getElementById('level').textContent = player.level;
      }

      // update HUD
      updateHUD();

      if (player.hp <= 0){
        // stop loop
        gameOver();
        return;
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // game over
  function gameOver(){
    running = false;
    // save highscore
    const hsKey = 'ffish_hs';
    const prev = Number(localStorage.getItem(hsKey) || 0);
    if (player.score > prev) localStorage.setItem(hsKey, String(player.score));
    document.getElementById('centerBox').innerHTML = `<h2>Game Over</h2><p>Bạn đạt ${player.score} điểm.</p><div style="margin-top:12px"><button id="btnRestart">Chơi lại</button></div>`;
    document.getElementById('centerMsg').style.display = 'flex';
    document.getElementById('btnRestart').addEventListener('click', () => {
      document.location.reload();
    });
  }

  // spawn initial enemies slowly
  setTimeout(()=>{ spawnInterval = 1800; }, 800);

  // helper: spawn some particles when bullet hits etc - handled in functions above

  // small hitbox floor check (not needed)

  // initial HUD
  updateHUD();

  // ensure audio starts on user gesture
  function resumeAudioOnGesture(){
    const resume = () => {
      audioCtx.resume && audioCtx.resume();
      window.removeEventListener('click', resume);
      window.removeEventListener('touchstart', resume);
    };
    window.addEventListener('click', resume);
    window.addEventListener('touchstart', resume);
  }
  resumeAudioOnGesture();

  // request fullscreen on start for immersive feel (best on mobile)
  function goFullscreen(){
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  document.getElementById('btnStart').addEventListener('click', goFullscreen);
  document.getElementById('btnStart2').addEventListener('click', goFullscreen);

  // clean up when leaving pointer lock
  controls.addEventListener('unlock', () => {
    // show center UI so user can resume
    document.getElementById('centerMsg').style.display = 'flex';
  });

  // clamp utility repeated (ok)
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // initial instruction for mobile rotate
  if (isMobile){
    // show overlay instruction if needed (left)
  }

  // click on canvas to lock pointer for desktop
  canvas.addEventListener('click', () => {
    if (!isMobile) controls.lock();
  });

  // initial camera object tie
  controls.getObject().position.set(0,1.6,0);
  scene.add(controls.getObject());

})();
</script>
</body>
</html>
