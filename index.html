<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ thống thi trắc nghiệm</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#2196f3,#00bcd4)}
.box{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
button{width:100%;padding:10px;border:none;border-radius:6px;background:#1e88e5;color:#fff;font-size:16px;margin:5px 0}
button:hover{background:#1565c0}
input,select{width:100%;padding:8px;margin:5px 0}
.answer{border:1px solid #ccc;padding:10px;margin:6px 0;border-radius:6px;cursor:pointer}
.answer:hover{background:#e3f2fd}
.correct{background:#43a047;color:white}
.wrong{background:#e53935;color:white}
.hidden{display:none}
.progress{height:8px;background:#ddd;border-radius:5px}
.bar{height:100%;background:#1e88e5;width:0%}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#1e88e5;color:white}
</style>
</head>
<body>

<div class="box" id="menu">
<h2>📘 HỆ THỐNG THI TRẮC NGHIỆM</h2>
<button onclick="showTeacher()">🧑‍🏫 Giáo viên</button>
<button onclick="showStudent()">👨‍🎓 Học sinh</button>
</div>

<div class="box hidden" id="teacher">
<h3>🔐 Giáo viên</h3>
<input type="password" id="pwd" placeholder="Mật khẩu (123456)">
<button onclick="login()">Đăng nhập</button>

<div id="teacherPanel" class="hidden">
<select id="subject">
<option value="toan">Toán</option>
<option value="van">Ngữ văn</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="ly">Vật lý</option>
</select>

<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">
<select id="correct">
<option value="0">A đúng</option>
<option value="1">B đúng</option>
<option value="2">C đúng</option>
<option value="3">D đúng</option>
</select>

<button onclick="addQ()">➕ Thêm câu hỏi</button>
<button onclick="loadList()">📄 Xem câu hỏi</button>
<button onclick="loadScores()">📊 Xem điểm hôm nay</button>
<button onclick="exportCSV()">💾 Xuất CSV</button>
<button onclick="back()">⬅ Quay lại</button>

<div id="list"></div>
<div id="scores"></div>
</div>
</div>

<div class="box hidden" id="student">
<h3>👨‍🎓 Làm bài</h3>
<input id="name" placeholder="Nhập tên">
<select id="sub">
<option value="toan">Toán</option>
<option value="van">Ngữ văn</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="ly">Vật lý</option>
</select>
<button onclick="start()">Bắt đầu</button>

<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>
<button onclick="next()">Tiếp</button>
<div id="result"></div>
<button onclick="back()">⬅ Menu</button>
</div>

<script>
let qs=[],i=0,score=0,name="",sub="";

function showTeacher(){menu.style.display="none";teacher.classList.remove("hidden")}
function showStudent(){menu.style.display="none";student.classList.remove("hidden")}
function back(){location.reload()}

function login(){
 if(pwd.value==="123456"){teacherPanel.classList.remove("hidden")}
 else alert("Sai mật khẩu")
}

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
}

function addQ(){
 let data=JSON.parse(localStorage.getItem("q_"+subject.value)||"[]");
 data.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value});
 localStorage.setItem("q_"+subject.value,JSON.stringify(data));
 alert("Đã thêm");
}

function loadList(){
 let data=JSON.parse(localStorage.getItem("q_"+subject.value)||"[]");
 list.innerHTML=data.map((x,i)=>`${i+1}. ${x.q}`).join("<br>");
}

function start(){
 name=document.getElementById("name").value;
 sub=document.getElementById("sub").value;
 qs=JSON.parse(localStorage.getItem("q_"+sub)||"[]");
 if(qs.length==0) return alert("Chưa có đề");
 shuffle(qs);
 i=0;score=0;
 loadQ();
}

function loadQ(){
 let q=qs[i];
 quiz.innerHTML=`<b>Câu ${i+1}:</b> ${q.q}`;
 q.a.forEach((x,j)=>{
   quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
 });
 bar.style.width=(i/qs.length*100)+"%";
}

let pick=-1;
function choose(j,e){
 pick=j;
 document.querySelectorAll(".answer").forEach(x=>x.classList.remove("active"));
 e.classList.add("active");
}

function next(){
 if(pick==-1) return alert("Chọn đáp án");
 if(pick==qs[i].c) score++;
 i++; pick=-1;
 if(i<qs.length) loadQ();
 else{
  quiz.innerHTML=`🎉 Hoàn thành<br>Điểm: ${score}/${qs.length}`;
  saveScore();
 }
}

function saveScore(){
 let data=JSON.parse(localStorage.getItem("score_"+sub)||"[]");
 data.push({name,score,total:qs.length,time:new Date().toLocaleString()});
 localStorage.setItem("score_"+sub,JSON.stringify(data));
}

function loadScores(){
 let data=JSON.parse(localStorage.getItem("score_"+subject.value)||"[]");
 let html="<table><tr><th>Tên</th><th>Điểm</th><th>Ngày</th></tr>";
 data.forEach(x=>html+=`<tr><td>${x.name}</td><td>${x.score}</td><td>${x.time}</td></tr>`);
 html+="</table>";
 scores.innerHTML=html;
}

function exportCSV(){
 let data=JSON.parse(localStorage.getItem("score_"+subject.value)||"[]");
 let csv="Tên,Điểm,Ngày\n";
 data.forEach(x=>csv+=`${x.name},${x.score},${x.time}\n`);
 let a=document.createElement("a");
 a.href="data:text/csv;charset=utf-8,"+encodeURI(csv);
 a.download="diem.csv";a.click();
}
</script>
</body>
</html>
