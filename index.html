<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm Địa Lí</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2196f3,#00bcd4);
    margin:0;
    overflow:hidden;
}
.box{
    max-width:720px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    position:relative;
    z-index:2;
}
h2{text-align:center;color:#1565c0}
.progress{
    height:8px;
    background:#ddd;
    border-radius:6px;
    overflow:hidden;
}
.bar{
    height:100%;
    width:0%;
    background:#1e88e5;
    transition:.3s;
}
.answer{
    border:1px solid #ccc;
    padding:10px;
    border-radius:6px;
    margin:8px 0;
    cursor:pointer;
}
.answer:hover{background:#e3f2fd}
.answer.correct{background:#43a047;color:white}
.answer.wrong{background:#e53935;color:white}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}
#result{
    text-align:center;
    font-size:18px;
    margin-top:15px;
    font-weight:bold;
}

#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.popup-box{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    max-width:320px;
    position:relative;
}
.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:22px;
    cursor:pointer;
}

.snow{
    position:fixed;
    top:-10px;
    color:white;
    font-size:14px;
    animation: fall linear infinite;
    z-index:1;
}
@keyframes fall{
    to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<!-- Popup -->
<div id="popup">
  <div class="popup-box">
    <div class="close" onclick="startQuiz()">✖</div>
    <h3>🎉 Chúc cả lớp 12A10 Full 10₫ </h3>
    <p>Tun Chúc bạn làm bài thật tốt!</p>
    <button onclick="startQuiz()">Bắt đầu</button>
  </div>
</div>

<div class="box">
<h2>KIỂM TRA ĐỊA LÍ</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>
<button onclick="next()">Tiếp theo</button>
<div id="result"></div>
</div>

<audio id="ting" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrong" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>
    
function snow(){
 let s=document.createElement("div");
 s.className="snow";
 s.innerHTML="❄";
 s.style.left=Math.random()*window.innerWidth+"px";
 s.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(s);
 setTimeout(()=>s.remove(),8000);
}
setInterval(snow,200);

// câu hỏi
let questions = [...[
{q:"Câu 1. Vùng trồng cà phê lớn nhất?",a:["Trung du miền núi Bắc","ĐBSH","Bắc Trung Bộ","Nam Trung Bộ"],correct:3},
{q:"Câu 2. Vùng trồng cao su lớn nhất?",a:["Trung du","Đông Nam Bộ","Bắc Trung Bộ","ĐBSCL"],correct:1},
{q:"Câu 3. Gió mùa hạ?",a:["Tây Nam","Đông Bắc","Tây Bắc","Đông Nam"],correct:0},
{q:"Câu 4. Vùng nhiều vịt nhất?",a:["Bắc Trung Bộ","Nam Trung Bộ","ĐBSH","ĐBSCL"],correct:3},
{q:"Câu 5. Vùng nhiều trâu nhất?",a:["Trung du miền núi Bắc","Nam Trung Bộ","ĐBSH","Đông Nam Bộ"],correct:0},
{q:"Câu 6. Đô thị hóa nước ta?",a:["Nhanh","Tăng dân thành thị","Hạn chế","Không có"],correct:1},
{q:"Câu 7. Công nghiệp thực phẩm đa dạng vì?",a:["Nguyên liệu phong phú","Lao động giỏi","Máy móc","Nhiều thành phần"],correct:0},
{q:"Câu 8. Công nghiệp chuyển dịch theo hướng?",a:["Thị trường","Công nghệ","Khai khoáng","Chiều rộng"],correct:1},
{q:"Câu 9. Khí hậu Nam Bộ?",a:["Ôn hòa","Khô hạn","Mưa – khô rõ","Nóng ẩm"],correct:2},
{q:"Câu 10. Mục đích KCN?",a:["Thu hút vốn","Liên kết","Tiêu dùng","Phân hóa"],correct:0},
{q:"Câu 11. Chuyển dịch công nghiệp nhằm?",a:["Khai thác thế mạnh","Đồng đều","Hội nhập","Việc làm"],correct:0},
{q:"Câu 12. Cơ cấu ngành thể hiện ở?",a:["Số ngành","Quan hệ","Tỉ trọng","Phân chia"],correct:2},
{q:"Câu 13. Suy thoái đất?",a:["Đa dạng","Bồi đắp","Xói mòn","Nhiễm mặn"],correct:3},
{q:"Câu 14. Vai trò xã hội KCN?",a:["Cơ cấu KT","Đầu tư","Xuất khẩu","Lao động"],correct:3},
{q:"Câu 15. Đô thị hóa VN?",a:["Chậm","Cao","Rất nhanh","Dân cao"],correct:0},
{q:"Câu 16. Đông Nam Bộ mạnh vì?",a:["Giá trị lớn","Quy mô","Nhiều KCN","Công nghệ"],correct:2},
{q:"Câu 17. Tây Bắc – Bắc Trung Bộ?",a:["Thảo nguyên","Cao nguyên","ĐB hẹp","Đồi thấp"],correct:2},
{q:"Câu 18. KCN khác điểm CN?",a:["Không dân cư","Phân bố","Vị trí","Không ranh giới"],correct:0},
{q:"Câu 19. Lợn nhiều nhất?",a:["Nam Trung Bộ","Bắc Trung Bộ","ĐBSH","ĐNB"],correct:2},
{q:"Câu 20. KCN cao tác động?",a:["Sản lượng","Đa dạng","Chất lượng","Nguyên liệu"],correct:2},
{q:"Câu 21. Chăn nuôi hiệu quả?",a:["Không giết","Dịch vụ","Đa dạng","KHCN"],correct:3},
{q:"Câu 22. Gió mùa đông?",a:["ĐN","TB","TN","ĐB"],correct:3},
{q:"Câu 23. CN chuyển dịch?",a:["Chế biến","Giảm cao cấp","Thấp","Khai thác"],correct:0},
{q:"Câu 24. Tăng lương thực?",a:["Khai hoang","Thâm canh","Đa dạng","VAC"],correct:1},
{q:"Câu 25. Sai về KT NN?",a:["Giảm","Chủ đạo","Quản lí","Ổn định"],correct:3},
{q:"Câu 26. FDI có vai trò?",a:["Cao nhất","Chủ đạo","Giá trị tăng","Ổn định"],correct:2},
{q:"Câu 27. Ngành dầu khí?",a:["Thu hút vốn","Đủ nhu cầu","Lạc hậu","Miền Bắc"],correct:0},
{q:"Câu 28. Suy giảm sinh vật?",a:["Giảm rừng","Loài mới","Rộng","Tăng rừng"],correct:0},
{q:"Câu 29. Thủy sản lớn nhất?",a:["ĐBSH","ĐNB","BTB","ĐBSCL"],correct:3},
{q:"Câu 30. Ảnh hưởng lớn nhất?",a:["Lao động","Cách mạng CN","Thị trường","Cơ sở vật chất"],correct:1}
]];

questions.sort(()=>Math.random()-0.5);

let i=0,score=0,selected=-1;

function startQuiz(){
 document.getElementById("popup").style.display="none";
 load();
}

function load(){
 let q=questions[i];
 let html=`<b>${q.q}</b>`;
 q.a.sort(()=>Math.random()-0.5).forEach((x,j)=>{
   html+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
 });
 document.getElementById("quiz").innerHTML=html;
 document.getElementById("bar").style.width=(i/questions.length*100)+"%";
}

function choose(j,el){
 selected=j;
 document.querySelectorAll(".answer").forEach(e=>e.classList.remove("active"));
 el.classList.add("active");
}

function next(){
 if(selected==-1){alert("Chọn đáp án!");return;}
 let answers=document.querySelectorAll(".answer");
 let correct=questions[i].a[questions[i].correct];

 if(answers[selected].innerText!==correct){
   answers[selected].classList.add("wrong");
   document.getElementById("wrong").play();
   return;
 }

 answers[selected].classList.add("correct");
 document.getElementById("ting").play();
 score++;

 setTimeout(()=>{
   i++; selected=-1;
   if(i<questions.length) load();
   else{
     document.getElementById("quiz").innerHTML="";
     document.getElementById("result").innerHTML=
     `🎉 Hoàn thành bài thi<br>Điểm: <b>${score}/30</b>`;
   }
 },500);
}
</script>
</body>
</html>
