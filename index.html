<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phòng Thi Online</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0d47a1,#00acc1)}
.box{max-width:1000px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,.3)}
h2{text-align:center;color:#0d47a1}
button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;background:#1976d2;color:white}
button:hover{background:#0d47a1}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:1px solid #ccc}
.answer{border:1px solid #ccc;padding:10px;margin:6px 0;border-radius:6px;cursor:pointer}
.answer:hover{background:#e3f2fd}
.correct{background:#4caf50;color:white}
.wrong{background:#e53935;color:white}
.hidden{display:none}
.progress{height:10px;background:#ddd;border-radius:5px;overflow:hidden}
.bar{height:100%;background:#1976d2;width:0%}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#1976d2;color:white}
</style>
</head>

<body>

<div class="box" id="home">
<h2>🏫 PHÒNG THI ONLINE</h2>
<button onclick="openTeacher()">👨‍🏫 Giáo viên</button>
<button onclick="openStudent()">👨‍🎓 Học sinh</button>
<button onclick="openSupport()">🆘 Hỗ trợ</button>
</div>

<!-- LOGIN -->
<div class="box hidden" id="login">
<h2>🔐 Đăng nhập giáo viên</h2>
<input id="pass" type="password" placeholder="Mật khẩu">
<button onclick="login()">Đăng nhập</button>
<button onclick="back()">⬅ Quay lại</button>
</div>

<!-- TEACHER -->
<div class="box hidden" id="teacher">
<h2>👨‍🏫 Quản lý</h2>

<select id="subject">
<option value="toan">Toán</option>
<option value="van">Ngữ văn</option>
<option value="anh">Anh</option>
<option value="ly">Lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
</select>

<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">

<select id="correct">
<option value="0">Đúng A</option>
<option value="1">Đúng B</option>
<option value="2">Đúng C</option>
<option value="3">Đúng D</option>
</select>

<button onclick="addQ()">➕ Thêm câu</button>
<button onclick="showQ()">📄 Câu hỏi</button>
<button onclick="showResult()">📊 Kết quả</button>
<button onclick="showSupport()">📨 Hỗ trợ</button>
<button onclick="clearAll()">🗑 Xóa dữ liệu</button>
<button onclick="back()">⬅ Quay lại</button>

<div id="output"></div>
</div>

<!-- STUDENT -->
<div class="box hidden" id="student">
<h2>📝 Làm bài</h2>
<input id="name" placeholder="Nhập tên">
<select id="sub">
<option value="toan">Toán</option>
<option value="van">Ngữ văn</option>
<option value="anh">Anh</option>
<option value="ly">Lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
</select>
<button onclick="start()">▶ Bắt đầu</button>

<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>
<button onclick="next()">Tiếp theo</button>
<div id="result"></div>
</div>

<!-- SUPPORT -->
<div class="box hidden" id="support">
<h2>🆘 Gửi hỗ trợ</h2>
<input id="sp_name" placeholder="Tên của bạn">
<textarea id="sp_msg" placeholder="Nội dung cần hỗ trợ"></textarea>
<button onclick="sendSupport()">📨 Gửi</button>
<button onclick="back()">⬅ Quay lại</button>
</div>

<script>
const PASS="14032008";
let list=[],i=0,score=0,selected=false;

function openTeacher(){home.classList.add("hidden");login.classList.remove("hidden")}
function openStudent(){home.classList.add("hidden");student.classList.remove("hidden")}
function openSupport(){home.classList.add("hidden");support.classList.remove("hidden")}
function back(){location.reload()}

function login(){
if(pass.value===PASS){
login.classList.add("hidden");
teacher.classList.remove("hidden");
}else alert("Sai mật khẩu!");
}

function addQ(){
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
d.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value});
localStorage.setItem(subject.value,JSON.stringify(d));
alert("Đã thêm câu hỏi");
}

function showQ(){
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
output.innerHTML=d.map((x,i)=>`${i+1}. ${x.q}`).join("<br>");
}

function start(){
if(name.value.trim()=="") return alert("Bạn phải nhập tên!");
list=JSON.parse(localStorage.getItem(sub.value)||"[]");
if(!list.length) return alert("Chưa có câu hỏi!");
i=0;score=0;
load();
}

function load(){
selected=false;
let q=list[i];
quiz.innerHTML=`<b>Câu ${i+1}:</b> ${q.q}`;
q.a.forEach((x,j)=>{
quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
});
bar.style.width=(i/list.length*100)+"%";
}

function choose(j,e){
if(selected) return;
selected=true;
if(j===list[i].c){e.classList.add("correct");score++}
else e.classList.add("wrong");
}

function next(){
if(!selected) return alert("Chọn đáp án!");
i++;
if(i<list.length) load();
else finish();
}

function finish(){
let r=JSON.parse(localStorage.getItem("result")||"[]");
r.push({name:name.value,subject:sub.value,score:score+"/"+list.length,time:new Date().toLocaleString()});
localStorage.setItem("result",JSON.stringify(r));
quiz.innerHTML="";
result.innerHTML=`🎉 Hoàn thành<br>Điểm: ${score}/${list.length}`;
}

function showResult(){
let d=JSON.parse(localStorage.getItem("result")||"[]");
let html="<table><tr><th>Tên</th><th>Môn</th><th>Điểm</th><th>Thời gian</th></tr>";
d.forEach(x=>html+=`<tr><td>${x.name}</td><td>${x.subject}</td><td>${x.score}</td><td>${x.time}</td></tr>`);
output.innerHTML=html+"</table>";
}

function sendSupport(){
let s=JSON.parse(localStorage.getItem("support")||"[]");
s.push({name:sp_name.value,msg:sp_msg.value,time:new Date().toLocaleString()});
localStorage.setItem("support",JSON.stringify(s));
alert("Đã gửi!");
sp_name.value="";sp_msg.value="";
}

function showSupport(){
let s=JSON.parse(localStorage.getItem("support")||"[]");
let html="<table><tr><th>Tên</th><th>Nội dung</th><th>Thời gian</th></tr>";
s.forEach(x=>html+=`<tr><td>${x.name}</td><td>${x.msg}</td><td>${x.time}</td></tr>`);
output.innerHTML=html+"</table>";
}

function clearAll(){
if(confirm("Xóa toàn bộ dữ liệu?")){
localStorage.clear();
alert("Đã xóa!");
}
}
</script>
</body>
</html>
