<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0a0a0a, #111827);
    color: white;
    margin: 0;
}
.header {
    padding: 25px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg,#00f7ff,#00ff99);
    -webkit-background-clip: text;
    color: transparent;
}
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
}
.card {
    width: 320px;
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    padding: 25px;
    margin: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,255,255,0.1);
    transition: 0.4s;
}
.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 50px rgba(0,255,255,0.3);
}
.title { font-size: 22px; font-weight: 600; }
.price {
    font-size: 34px;
    font-weight: 700;
    margin: 15px 0;
    color: #00ffcc;
}
.features {
    text-align: left;
    font-size: 14px;
    line-height: 1.6;
    color: #ccc;
}
.features span { display: block; }
button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg,#00f7ff,#00ff99);
    color: black;
    font-weight: bold;
    cursor: pointer;
}
.hidden { display: none; }
.qr img {
    width: 260px;
    border-radius: 15px;
    margin-top: 20px;
}
.note {
    margin-top: 20px;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    color: #00ffcc;
}
</style>
</head>

<body>

<div class="header">PROXY PREMIUM SERVICE</div>

<div class="container" id="home">

    <div class="card">
        <div class="title">Proxy Basic</div>
        <div class="price">250.000đ</div>
        <div class="features">
            <span>✔ Proxy VIP Antiband</span>
            <span>✔ Dùng ổn định</span>
            <span>✔ iPhone & Android</span>
        </div>
        <button onclick="buy(250000, 'Basic')">MUA NGAY</button>
    </div>

    <div class="card">
        <div class="title">Proxy Pro</div>
        <div class="price">500.000đ</div>
        <div class="features">
            <span>✔ Proxy Premium</span>
            <span>✔ Tốc độ cao</span>
            <span>✔ Ưu tiên cấp nhanh</span>
        </div>
        <button onclick="buy(500000, 'Pro')">MUA NGAY</button>
    </div>

</div>

<div class="container hidden" id="pay">
    <h2>Thanh toán</h2>

    <div class="qr">
        <img id="qrImg">
    </div>

    <div class="note" id="noteText"></div>

    <button onclick="copyText()">📋 COPY</button>
    <button onclick="done()">✅ ĐÃ CHUYỂN</button>
    <button onclick="back()">⬅ Quay lại</button>
</div>

<script>
const BANK = "MB";
const ACCOUNT = "0359268648";
const NAME = "PROXY";

const BOT_TOKEN = "YOUR_BOT_TOKEN";
const CHAT_ID = "YOUR_CHAT_ID";

let currentNote = "";
let orderId = "";
let currentType = "";
let currentAmount = "";

// random mã đơn
function generateOrder() {
    return "DH" + Math.floor(Math.random() * 999999);
}

function buy(amount, type) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("pay").classList.remove("hidden");

    orderId = generateOrder();
    currentType = type;
    currentAmount = amount;

    let shortPrice = amount === 250000 ? "250K" : "500K";

    let note = `DH:${orderId} | ${shortPrice} | ${type} | SDT + THIETBI`;
    currentNote = note;

    document.getElementById("noteText").innerText = note;

    let qr = `https://img.vietqr.io/image/${BANK}-${ACCOUNT}-compact.png?amount=${amount}&addInfo=${encodeURIComponent(note)}&accountName=${NAME}`;
    document.getElementById("qrImg").src = qr;
}

function copyText() {
    navigator.clipboard.writeText(currentNote);
    alert("Đã copy!");
}

function done() {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `📦 ĐƠN MỚI
🆔 Mã: ${orderId}
💰 Gói: ${currentType}
💵 Giá: ${currentAmount}
📝 Nội dung CK: ${currentNote}`
        })
    });

    alert("Đã gửi về TELE!");
}

function back() {
    document.getElementById("home").classList.remove("hidden");
    document.getElementById("pay").classList.add("hidden");
}
</script>

</body>
</html>
