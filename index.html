<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ Thống Thi Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{
    font-family: 'Roboto', Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg,#2196f3,#00bcd4);
    overflow-x:hidden;
    color:#333;
}
.box{
    max-width:900px;
    margin:20px auto;
    background:#fff;
    padding:25px 30px;
    border-radius:15px;
    position:relative;
    transition:all 0.3s;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.hidden{display:none}
input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    cursor:pointer;
    outline:none;
    transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
}
.button-animate{
    background: linear-gradient(45deg,#42a5f5,#1e88e5);
    font-weight:600;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:17px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
.button-animate:hover{
    background: linear-gradient(45deg,#1e88e5,#42a5f5);
    transform:scale(1.05);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}
.button-animate:active{
    transform:scale(0.97);
}
.answer{
    border:1px solid #ccc;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.25s ease-out;
    font-size:16px;
}
.answer:hover{background:#e3f2fd;}
.correct{
    background:#4caf50 !important;
    color:#fff !important;
    font-weight:bold;
    transform:scale(1.1);
}
.wrong{
    background:#f44336 !important;
    color:#fff !important;
    font-weight:bold;
    transform:scale(1.1);
}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;font-size:15px;}
th{background:#1976d2;color:#fff;}
.loading{text-align:center;font-size:18px;font-weight:500;}
.close-btn{
    position:absolute;
    top:10px;
    right:10px;
    background:#f44336;
    width:40px;
    height:40px;
    color:#fff;
    border:none;
    border-radius:50%;
    font-weight:bold;
    cursor:pointer;
    font-size:18px;
    z-index:10;
    transition: all 0.2s;
}
.close-btn:hover{background:#d32f2f;transform:scale(1.1);}
.progress-container{width:100%;background:#ddd;border-radius:10px;margin:15px 0;height:15px;}
.progress-bar{width:0%;height:100%;background:#4caf50;border-radius:10px;transition: width 0.15s ease-out;}
.menu-cards{display:flex;justify-content:center;gap:25px;margin-top:30px;flex-wrap:wrap;}
.card{
  width:180px;
  height:180px;
  background:linear-gradient(135deg,#42a5f5,#1e88e5);
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:#fff;font-weight:bold;font-size:20px;cursor:pointer;transition: all 0.2s ease-out;
}
.card:hover{transform:scale(1.05);box-shadow:0 12px 25px rgba(0,0,0,0.5);}
.icon{font-size:50px;margin-bottom:10px;}
.text{font-size:22px;}
</style>
</head>
<body>

<audio id="soundCorrect" src="https://freesound.org/data/previews/341/341695_3248244-lq.mp3"></audio>
<audio id="soundWrong" src="https://freesound.org/data/previews/276/276020_5121236-lq.mp3"></audio>

<!-- MENU -->
<div class="box" id="home">
<h2>🎓 HỆ THỐNG THI ONLINE</h2>
<div class="menu-cards">
  <div class="card" onclick="openTeacher()">
    <div class="icon">👨‍🏫</div>
    <div class="text">Giáo viên</div>
  </div>
  <div class="card" onclick="openStudent()">
    <div class="icon">👨‍🎓</div>
    <div class="text">Học sinh</div>
  </div>
</div>
</div>

<!-- LOGIN -->
<div class="box hidden" id="loginBox">
<button class="close-btn" onclick="reload()">✖</button>
<h3>Đăng nhập giáo viên</h3>
<input type="password" id="pass" placeholder="Mật khẩu">
<button class="button-animate" onclick="login()">Đăng nhập</button>
<button class="button-animate" onclick="reload()">⬅ Quay lại</button>
</div>

<!-- GIÁO VIÊN -->
<div class="box hidden" id="teacher">
<button class="close-btn" onclick="reload()">✖</button>
<h3>👨‍🏫 Quản lý</h3>
<select id="subject">
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>
<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">
<select id="correct">
<option value="">-- Chọn đáp án đúng --</option>
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
<button class="button-animate" onclick="addQ()">➕ Thêm câu hỏi</button>
<button class="button-animate" onclick="showQ()">📄 Xem / Xoá câu hỏi</button>
<button class="button-animate" onclick="showScores()">📊 Xem điểm</button>
<button class="button-animate" onclick="clearScores()">🗑 Xoá dữ liệu học sinh</button>
<button class="button-animate" onclick="reload()">🏠 Thoát</button>
</div>
<div id="out" style="margin-top:10px;"></div>
</div>

<!-- HỌC SINH -->
<div class="box hidden" id="student">
<button class="close-btn" onclick="reload()">✖</button>
<h3>📝 Làm bài</h3>
<input id="nameInput" placeholder="Nhập tên học sinh">
<select id="sub">
<option value="">-- Chọn môn --</option>
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
<button class="button-animate" onclick="start()">Bắt đầu</button>
<button class="button-animate" onclick="resetQuiz()">🔄 Reset bài</button>
<button class="button-animate" onclick="reload()">🏠 Thoát</button>
</div>
<div id="loading" class="loading hidden">⏳ Đang tải đề...</div>
<div id="quiz"></div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div style="display:flex;justify-content:space-between">
<button class="button-animate" onclick="prev()">⬅ Quay lại</button>
<button class="button-animate" onclick="next()">Tiếp ➡</button>
</div>
<div id="result" style="margin-top:15px;font-size:18px;font-weight:500;"></div>
</div>

<script>
const PASS="14032008";
let list=[],i=0,score=0,selected=false,wrong=0;
const home=document.getElementById("home");
const loginBox=document.getElementById("loginBox");
const teacher=document.getElementById("teacher");
const student=document.getElementById("student");
const out=document.getElementById("out");
const quiz=document.getElementById("quiz");
const loading=document.getElementById("loading");
const result=document.getElementById("result");
const nameInput=document.getElementById("nameInput");
const sub=document.getElementById("sub");
const pass=document.getElementById("pass");
const subject=document.getElementById("subject");
const q=document.getElementById("q");
const a1=document.getElementById("a1");
const a2=document.getElementById("a2");
const a3=document.getElementById("a3");
const a4=document.getElementById("a4");
const correct=document.getElementById("correct");
const progressBar=document.getElementById("progressBar");
const soundCorrect=document.getElementById("soundCorrect");
const soundWrong=document.getElementById("soundWrong");

function reload(){location.reload();}
function openTeacher(){home.classList.add("hidden");loginBox.classList.remove("hidden");}
function openStudent(){home.classList.add("hidden");student.classList.remove("hidden");}
function login(){
    if(pass.value === PASS){
        pass.value="";loginBox.classList.add("hidden");teacher.classList.remove("hidden");
    } else {alert("Sai mật khẩu!"); pass.value=""; pass.focus();}
}

function addQ(){
    if(!q.value||!a1.value||!a2.value||!a3.value||!a4.value||correct.value==="") return alert("Nhập đầy đủ!");
    let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
    d.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value});
    localStorage.setItem(subject.value,JSON.stringify(d));
    alert("Đã lưu câu hỏi!"); q.value=a1.value=a2.value=a3.value=a4.value=""; correct.value="";
}

function showQ(){
    let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
    out.innerHTML=d.length>0?d.map((x,i)=>`${i+1}. ${x.q} <button class="button-animate" onclick="delQ(${i})">❌</button>`).join("<br>"):"Chưa có câu hỏi!";
}

function delQ(i){
    let d=JSON.parse(localStorage.getItem(subject.value));
    d.splice(i,1); localStorage.setItem(subject.value,JSON.stringify(d));
    showQ();
}

function start(){
    let name=nameInput.value.trim();
    let mon=sub.value;
    if(name==""||mon==""){alert("Vui lòng nhập tên và chọn môn!"); return;}
    list=JSON.parse(localStorage.getItem(mon)||"[]");
    if(list.length==0){alert("Môn này chưa có câu hỏi!"); return;}
    loading.classList.remove("hidden");
    setTimeout(()=>{loading.classList.add("hidden"); i=0; score=0; wrong=0; selected=false; load(); updateProgress(); result.innerHTML="";},200);
}

function load(){
    selected=false;
    let qObj=list[i];
    quiz.innerHTML=`<b>Câu ${i+1}/${list.length}:</b> ${qObj.q}`;
    qObj.a.forEach((x,j)=>{quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;});
    updateProgress();
}

function choose(j,e){
    if(selected) return;
    selected=true;
    const answers=document.querySelectorAll(".answer");
    if(j===list[i].c){e.classList.add("correct");score++;soundCorrect.play().catch(()=>{});}
    else{e.classList.add("wrong");wrong++;soundWrong.play().catch(()=>{});}
    answers[list[i].c].classList.add("correct");
}

function next(){if(!selected) return alert("Chọn đáp án!"); i++; if(i<list.length) load(); else finish();}
function prev(){if(i>0){i--; load();}else alert("Bạn đang ở câu đầu tiên!");}

function finish(){
    let arr=JSON.parse(localStorage.getItem("scores")||"[]");
    arr.push({name:nameInput.value.trim(),mon:sub.value,score:score,date:new Date().toLocaleString()});
    localStorage.setItem("scores",JSON.stringify(arr));
    result.innerHTML=`🎉 Hoàn thành!<br>✅ Đúng: ${score} <br>❌ Sai: ${wrong}`;
}

function showScores(){
    let s=JSON.parse(localStorage.getItem("scores")||"[]");
    out.innerHTML=s.length>0?"<table><tr><th>Tên</th><th>Môn</th><th>Điểm</th><th>Ngày</th></tr>"+s.map(x=>`<tr><td>${x.name}</td><td>${x.mon}</td><td>${x.score}</td><td>${x.date}</td></tr>`).join("")+"</table>":"Chưa có dữ liệu!";
}

function clearScores(){if(confirm("Xoá toàn bộ dữ liệu học sinh?")){localStorage.removeItem("scores"); alert("Đã xoá dữ liệu!"); out.innerHTML="";}}
function resetQuiz(){if(confirm("Bạn có muốn reset bài làm?")){i=0; score=0; wrong=0; selected=false; result.innerHTML=""; quiz.innerHTML=""; progressBar.style.width="0%"; nameInput.value=""; sub.value="";}}
function updateProgress(){progressBar.style.width=((i+1)/list.length*100)+"%";}
</script>
</body>
</html>
