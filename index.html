<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài kiểm tra Địa Lí</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2196f3,#00bcd4);
    margin:0;
}
.box{
    max-width:720px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}
h2{text-align:center;color:#1565c0}
input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-bottom:10px;
}
.progress{
    height:8px;
    background:#ddd;
    border-radius:6px;
    overflow:hidden;
}
.bar{
    height:100%;
    width:0%;
    background:#1e88e5;
    transition:.3s;
}
.answer{
    border:1px solid #ccc;
    padding:10px;
    border-radius:6px;
    margin:8px 0;
    cursor:pointer;
}
.answer:hover{background:#e3f2fd}
.answer.active{background:#1e88e5;color:white}
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#1e88e5;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}
#result{
    text-align:center;
    font-size:18px;
    margin-top:15px;
    font-weight:bold;
}

/* Popup chào */
#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.popup-box{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    max-width:320px;
    animation: zoom .4s ease;
}
.popup-box h3{color:#1565c0}
.close{
    position:absolute;
    right:15px;
    top:10px;
    font-size:22px;
    cursor:pointer;
}
@keyframes zoom{
    from{transform:scale(.5);opacity:0}
    to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<!-- Popup chào -->
<div id="popup">
  <div class="popup-box">
    <div class="close" onclick="closePopup()">✖</div>
    <h3>🎉 Chào mừng bạn!</h3>
    <p>Chúc bạn làm bài thật tốt 💯</p>
    <button onclick="closePopup()">Bắt đầu làm bài</button>
  </div>
</div>

<div class="box">
<h2>KIỂM TRA ĐỊA LÍ</h2>
<input id="name" placeholder="Nhập tên học sinh">

<div class="progress"><div class="bar" id="bar"></div></div>
<div id="quiz"></div>

<button onclick="next()">Tiếp theo</button>
<div id="result"></div>
</div>

<!-- Âm thanh -->
<audio id="ting" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="start" src="https://www.soundjay.com/buttons/sounds/button-09.mp3"></audio>

<script>
document.getElementById("start").play();

function closePopup(){
 document.getElementById("popup").style.display="none";
}

const questions = [
{q:"Câu 1. Vùng nào có diện tích trồng cà phê lớn nhất?",a:["Trung du và miền núi phía Bắc","Đồng bằng sông Hồng","Bắc Trung Bộ","Nam Trung Bộ"],correct:3},
{q:"Câu 2. Vùng trồng cao su lớn nhất?",a:["Trung du và miền núi phía Bắc","Đông Nam Bộ","Bắc Trung Bộ","ĐBSCL"],correct:1},
{q:"Câu 3. Gió mùa hạ chủ yếu hướng nào?",a:["Tây Nam","Đông Bắc","Tây Bắc","Đông Nam"],correct:0},
{q:"Câu 4. Vùng nuôi vịt nhiều nhất?",a:["Bắc Trung Bộ","Nam Trung Bộ","ĐBSH","ĐBSCL"],correct:3},
{q:"Câu 5. Vùng nuôi trâu nhiều nhất?",a:["TDMNPB","Nam Trung Bộ","ĐBSH","Đông Nam Bộ"],correct:0},
{q:"Câu 6. Đặc điểm đô thị hóa nước ta?",a:["Tốc độ nhanh","Tỉ lệ dân tăng","Hạn chế lối sống","Không có TP"],correct:1},
{q:"Câu 7. Nguyên nhân CNTP đa dạng?",a:["Nguyên liệu phong phú","Lao động cao","Kĩ thuật tốt","Nhiều thành phần"],correct:0},
{q:"Câu 8. Công nghiệp chuyển dịch theo hướng?",a:["Trong nước","Nâng cao công nghệ","Khai khoáng","Chiều rộng"],correct:1},
{q:"Câu 9. Khí hậu Nam Trung Bộ – Nam Bộ?",a:["Ôn hòa","Khô quanh năm","Mưa – khô rõ","Nóng ẩm"],correct:2},
{q:"Câu 10. Mục đích xây KCN?",a:["Thu hút FDI","Hợp tác CN","Tiêu dùng","Phân hóa lãnh thổ"],correct:0},
{q:"Câu 11. Mục đích chuyển dịch CN?",a:["Khai thác thế mạnh","Phát triển đều","Hội nhập","Việc làm"],correct:0},
{q:"Câu 12. Cơ cấu ngành thể hiện ở?",a:["Số ngành","Quan hệ ngành","Tỉ trọng ngành","Phân chia"],correct:2},
{q:"Câu 13. Suy thoái đất đồng bằng?",a:["Đa dạng đất","Phù sa","Xói mòn","Nhiễm mặn"],correct:3},
{q:"Câu 14. Vai trò xã hội KCN?",a:["Chuyển dịch KT","Thu hút vốn","Xuất khẩu","Chuyển dịch LĐ"],correct:3},
{q:"Câu 15. Đô thị hóa nước ta?",a:["Chậm","Cao","Nhanh","Tỉ lệ lớn"],correct:0},
{q:"Câu 16. Đông Nam Bộ CN cao vì?",a:["Giá trị cao","Quy mô lớn","Nhiều KCN","Công nghệ cao"],correct:2},
{q:"Câu 17. Địa hình Tây Bắc – Bắc Trung Bộ?",a:["Thảo nguyên","Cao nguyên","ĐB hẹp","Đồi thấp"],correct:2},
{q:"Câu 18. Khác KCN & điểm CN?",a:["Không dân cư","Không đều","Vị trí tốt","Không ranh giới"],correct:0},
{q:"Câu 19. Vùng nuôi lợn nhiều?",a:["Nam Trung Bộ","Bắc Trung Bộ","ĐBSH","Đông Nam Bộ"],correct:2},
{q:"Câu 20. KCN công nghệ cao giúp?",a:["Tăng sản lượng","Đa dạng","Tăng chất lượng","Giảm phụ thuộc"],correct:2},
{q:"Câu 21. Xu hướng chăn nuôi?",a:["SP không giết","Dịch vụ","Đa dạng","Ứng dụng KHKT"],correct:3},
{q:"Câu 22. Gió mùa đông?",a:["Đông Nam","Tây Bắc","Tây Nam","Đông Bắc"],correct:3},
{q:"Câu 23. CN chuyển dịch theo?",a:["Chế biến","Giảm cao cấp","Chất lượng thấp","Khai thác"],correct:0},
{q:"Câu 24. Tăng lương thực?",a:["Khai hoang","Thâm canh","Đa dạng","VAC"],correct:1},
{q:"Câu 25. Sai về KT Nhà nước?",a:["Giảm tỉ trọng","Chủ đạo","Quản lí","Ổn định"],correct:3},
{q:"Câu 26. Vai trò FDI?",a:["Cao nhất GDP","Chủ đạo","Giá trị tăng","Ổn định"],correct:2},
{q:"Câu 27. Ngành dầu khí?",a:["Thu hút FDI","Đủ nhu cầu","Lạc hậu","Miền Bắc"],correct:0},
{q:"Câu 28. Suy giảm sinh vật?",a:["Rừng giảm","Loài mới","Rộng","Tăng rừng"],correct:0},
{q:"Câu 29. Nuôi thủy sản nhiều?",a:["ĐBSH","Đông Nam Bộ","Bắc Trung Bộ","ĐBSCL"],correct:3},
{q:"Câu 30. Tác động KCN?",a:["Lao động","Cách mạng CN","Thị trường","CSVC"],correct:1},
];

let i=0,score=0,selected=-1;

function load(){
 let q=questions[i];
 let html=`<b>${q.q}</b>`;
 q.a.forEach((x,j)=>{
   html+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
 });
 document.getElementById("quiz").innerHTML=html;
 document.getElementById("bar").style.width=(i/questions.length*100)+"%";
}

function choose(j,el){
 selected=j;
 document.querySelectorAll(".answer").forEach(e=>e.classList.remove("active"));
 el.classList.add("active");
}

function next(){
 if(selected==-1){alert("Vui lòng chọn đáp án!");return;}
 if(selected===questions[i].correct){
   document.getElementById("ting").play();
   score++;
 }
 i++; selected=-1;
 if(i<questions.length) load();
 else{
   document.getElementById("quiz").innerHTML="";
   document.getElementById("result").innerHTML=`🎉 Hoàn thành!<br>Điểm: <b>${score}/30</b>`;
 }
}
load();
</script>
</body>
</html>
