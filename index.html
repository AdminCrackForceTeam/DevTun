<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ Thống Thi Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#2196f3,#00bcd4);
    overflow-x:hidden;
}
.box{
    max-width:900px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.3)
}
.hidden{display:none}
button{
    width:100%;
    padding:10px;
    margin:6px 0;
    border:none;
    border-radius:6px;
    background:#1976d2;
    color:#fff;
    font-size:16px;
}
input,select{
    width:100%;
    padding:8px;
    margin:5px 0;
}
.answer{
    border:1px solid #ccc;
    padding:10px;
    margin:5px 0;
    border-radius:6px;
    cursor:pointer;
}
.correct{background:#4caf50;color:#fff}
.wrong{background:#f44336;color:#fff}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:6px;text-align:center}

/* nút thoát */
#backBtn{
    position:fixed;
    top:10px;
    right:10px;
    background:#e53935;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    z-index:9999;
}
#backBtn:hover{opacity:.8}

#snow{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
}
</style>
</head>

<body>

<button id="backBtn" onclick="goHome()">🏠 Menu</button>
<canvas id="snow"></canvas>

<div class="box" id="home">
<h2>🎓 HỆ THỐNG THI ONLINE</h2>
<button onclick="openTeacher()">👨‍🏫 Giáo viên</button>
<button onclick="openStudent()">👨‍🎓 Học sinh</button>
</div>

<div class="box hidden" id="login">
<h3>Đăng nhập giáo viên</h3>
<input id="pass" type="password" placeholder="Mật khẩu">
<button onclick="login()">Đăng nhập</button>
</div>

<div class="box hidden" id="teacher">
<h3>👨‍🏫 Quản lý</h3>

<select id="subject">
<option value="toan">Toán</option>
<option value="ly">Vật lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Ngữ văn</option>
</select>

<input id="q" placeholder="Câu hỏi">
<input id="a1" placeholder="Đáp án A">
<input id="a2" placeholder="Đáp án B">
<input id="a3" placeholder="Đáp án C">
<input id="a4" placeholder="Đáp án D">

<select id="correct">
<option value="">Đáp án đúng</option>
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>

<button onclick="addQ()">➕ Thêm câu hỏi</button>
<button onclick="showQ()">📄 Xem / Xoá câu hỏi</button>
<button onclick="showScores()">📊 Xem điểm</button>
<button onclick="clearScores()">🗑 Xoá dữ liệu</button>

<div id="out"></div>
</div>

<div class="box hidden" id="student">
<h3>📝 Làm bài</h3>

<input id="nameInput" placeholder="Nhập tên">
<select id="sub">
<option value="">-- Chọn môn --</option>
<option value="toan">Toán</option>
<option value="ly">Lý</option>
<option value="hoa">Hóa</option>
<option value="sinh">Sinh</option>
<option value="su">Sử</option>
<option value="dia">Địa</option>
<option value="van">Văn</option>
</select>

<button onclick="start()">Bắt đầu</button>
<div id="online"></div>
<div id="loading" class="hidden">⏳ Đang tải đề...</div>

<div id="quiz"></div>
<button onclick="next()">Tiếp</button>
<div id="result"></div>
</div>

<script>
const PASS="14032008";
let list=[],i=0,score=0,selected=false;

/* ===== CHUYỂN MÀN ===== */
function goHome(){
document.querySelectorAll(".box").forEach(b=>b.classList.add("hidden"));
home.classList.remove("hidden");
}

/* ===== GIÁO VIÊN ===== */
function openTeacher(){
home.classList.add("hidden");
login.classList.remove("hidden");
}
function login(){
if(pass.value===PASS){
login.classList.add("hidden");
teacher.classList.remove("hidden");
}else alert("Sai mật khẩu!");
}

function addQ(){
if(!q.value||!a1.value||!a2.value||!a3.value||!a4.value||correct.value==="")
return alert("Nhập đủ dữ liệu!");
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
d.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+correct.value});
localStorage.setItem(subject.value,JSON.stringify(d));
alert("Đã lưu");
}

function showQ(){
let d=JSON.parse(localStorage.getItem(subject.value)||"[]");
out.innerHTML=d.map((x,i)=>`${i+1}. ${x.q}
<button onclick="delQ(${i})">❌</button>`).join("<br>");
}
function delQ(i){
let d=JSON.parse(localStorage.getItem(subject.value));
d.splice(i,1);
localStorage.setItem(subject.value,JSON.stringify(d));
showQ();
}

function showScores(){
let s=JSON.parse(localStorage.getItem("scores")||"[]");
out.innerHTML="<table><tr><th>Tên</th><th>Môn</th><th>Điểm</th><th>Ngày</th></tr>"+
s.map(x=>`<tr><td>${x.name}</td><td>${x.mon}</td><td>${x.score}</td><td>${x.date}</td></tr>`).join("")+"</table>";
}

function clearScores(){
if(confirm("Xoá toàn bộ dữ liệu?")){
localStorage.removeItem("scores");
alert("Đã xoá!");
}
}

/* ===== HỌC SINH ===== */
function openStudent(){
home.classList.add("hidden");
student.classList.remove("hidden");
}

function start(){
let name=nameInput.value.trim();
if(!name||!sub.value) return alert("Nhập tên và chọn môn!");

list=JSON.parse(localStorage.getItem(sub.value)||"[]");
if(!list.length) return alert("Môn chưa có câu hỏi!");

loading.classList.remove("hidden");
setTimeout(()=>{
loading.classList.add("hidden");
i=0;score=0;
load();
},800);
}

function load(){
selected=false;
let q=list[i];
quiz.innerHTML=`<b>Câu ${i+1}:</b> ${q.q}`;
q.a.forEach((x,j)=>{
quiz.innerHTML+=`<div class="answer" onclick="choose(${j},this)">${x}</div>`;
});
}

function choose(j,e){
if(selected) return;
selected=true;
if(j===list[i].c){e.classList.add("correct");score++}
else e.classList.add("wrong");
}

function next(){
if(!selected) return alert("Chọn đáp án!");
i++;
if(i<list.length) load();
else finish();
}

function finish(){
let s=JSON.parse(localStorage.getItem("scores")||"[]");
s.push({
name:nameInput.value,
mon:sub.value,
score:score,
date:new Date().toLocaleString()
});
localStorage.setItem("scores",JSON.stringify(s));
result.innerHTML=`🎉 Hoàn thành<br>Điểm: ${score}/${list.length}`;
}

/* ===== TUYẾT RƠI ===== */
const c=document.getElementById("snow"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let snow=[];
for(let i=0;i<100;i++)snow.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*3+1});
function draw(){
ctx.clearRect(0,0,c.width,c.height);
ctx.fillStyle="white";
snow.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
s.y+=s.r;
if(s.y>c.height)s.y=0;
});
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
